name: Unified CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: ['**']

permissions:
  contents: read
  id-token: write

jobs:
  # [1] 변화 감지
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.set-matrix.outputs.services_json }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths (services)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users:
              - 'users/**'
            stores:
              - 'stores/**'
            order:
              - 'order/**'
            orderQuery:
              - 'orderQuery/**'
            payment:
              - 'payment/**'
            gateway:
              - 'gateway/**'
            checkIns:
              - 'checkIns/**'
            common-lib:
              - 'common-lib/**'
            build-config:
              - 'gradle/**'
              - '*.gradle'
              - 'gradle.properties'
              - '.github/workflows/unified-cicd.yml'

      - name: Build matrix output
        id: set-matrix
        shell: bash
        run: |
          services=()

          if [[ "${{ steps.filter.outputs.users }}" == "true" ]]; then
            services+=("users")
          fi
          if [[ "${{ steps.filter.outputs.order }}" == "true" ]]; then
            services+=("order")
          fi
          if [[ "${{ steps.filter.outputs.payment }}" == "true" ]]; then
            services+=("payment")
          fi
          if [[ "${{ steps.filter.outputs.orderQuery }}" == "true" ]]; then
            services+=("orderQuery")
          fi
          if [[ "${{ steps.filter.outputs.stores }}" == "true" ]]; then
            services+=("stores")
          fi
          if [[ "${{ steps.filter.outputs.gateway }}" == "true" ]]; then
            services+=("gateway")
          fi
          if [[ "${{ steps.filter.outputs.checkIns }}" == "true" ]]; then
            services+=("checkIns")
          fi

          if [[ "${{ steps.filter.outputs.common-lib }}" == "true" ]] || [[ "${{ steps.filter.outputs.build-config }}" == "true" ]]; then
            services=("users" "stores" "order" "orderQuery" "payment" "gateway" "checkIns")
          fi
          if [[ ${#services[@]} -eq 0 ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            {
              echo "services_json<<EOF"
              echo "[]"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # JSON 배열 만들기
          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s .)

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "services_json<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Debug outputs
        run: |
          echo "has_changes=${{ steps.set-matrix.outputs.has_changes }}"
          echo "services_json=${{ steps.set-matrix.outputs.services_json }}"

  test:
    name: Test (matrix)
    needs: detect-changes
    if: false
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Testing service: ${{ matrix.service }}"
          if [ -d "${{ matrix.service }}" ]; then
            ./gradlew :${{ matrix.service }}:test -x javadoc --build-cache --configuration-cache --parallel
          else
            echo "Directory not found for service: ${{ matrix.service }} (skipping)"
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4"
          DB_HOST: localhost
          SPRING_PROFILES_ACTIVE: test

  # [2] 서비스 빌드
  build-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    name: Build ${{ matrix.service }} Module
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Module
        # ✅ 하드코딩된 :users 대신 matrix 변수 사용
        run: ./gradlew :${{ matrix.service }}:bootJar -x test -x javadoc --build-cache --configuration-cache --parallel
        env:
          DB_HOST: localhost
          SPRING_PROFILES_ACTIVE: test
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: ${{ matrix.service }}/build/libs/
          retention-days: 7

  # [3] Docker 빌드 및 푸시
  docker-build-push-ecr:
    needs: [detect-changes, build-service] # ✅ detect-changes가 필요함
    if: github.event_name == 'push' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ✅ 여기서도 matrix를 정의해야 ${{ matrix.service }}를 사용할 수 있습니다.
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    name: Push ${{ matrix.service }} to ECR

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn-user
      ECR_ORDER_REPOSITORY: goorm-popcorn-order
      ECR_GATEWAY_REPOSITORY: goorm-popcorn-api-gateway

      CONTAINER_NAME: user-service
      CONTAINER_ORDER_NAME: order-service
      CONTAINER_GATEWAY_NAME: api-gateway

      DB_HOST: localhost
      DB_PORT: 5430
      DB_NAME: popcorn_db

      ORDER_DB_USERNAME: order_app
      ORDER_DB_PASSWORD: order321
      ORDER_FLYWAY_USERNAME: order_migrator
      ORDER_FLYWAY_PASSWORD: order321

      ORDER_QUERY_DB_USERNAME: order_query_app
      ORDER_QUERY_DB_PASSWORD: quary123

      ORDER_QUERY_FLYWAY_USERNAME: order_query_migrator
      ORDER_QUERY_FLYWAY_PASSWORD: quary321


      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==PASSPORT_SECRET=passport-shared-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ 서비스별 변수 동적 매핑 (여기에 order와 gateway 설정을 모두 넣습니다)
      - name: Set service-specific variables
        id: vars
        run: |
          if [ "${{ matrix.service }}" == "order" ]; then
            echo "ecr_repo=goorm-popcorn-order" >> $GITHUB_OUTPUT
            echo "task_def_file=order/goorm-popcorn-dev-order-service.json" >> $GITHUB_OUTPUT
            echo "container_name=order-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "gateway" ]; then
            echo "ecr_repo=goorm-popcorn-api-gateway" >> $GITHUB_OUTPUT
            echo "task_def_file=gateway/goorm-popcorn-dev-api-gateway.json" >> $GITHUB_OUTPUT
            echo "container_name=api-gateway" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "users" ]; then
            echo "ecr_repo=goorm-popcorn-user" >> $GITHUB_OUTPUT
            echo "task_def_file=users/goorm-popcorn-dev-user-service-revision2.json" >> $GITHUB_OUTPUT
            echo "container_name=user-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "orderQuery" ]; then
            echo "ecr_repo=goorm-popcorn-order-query" >> $GITHUB_OUTPUT
            echo "task_def_file=orderQuery/goorm-popcorn-dev-order-query.json" >> $GITHUB_OUTPUT
            echo "container_name=order-query" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "payment" ]; then
            echo "ecr_repo=goorm-popcorn-payment" >> $GITHUB_OUTPUT
            echo "task_def_file=payment/goorm-popcorn-dev-payment-service.json" >> $GITHUB_OUTPUT
            echo "container_name=payment-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "stores" ]; then
            echo "ecr_repo=goorm-popcorn-store" >> $GITHUB_OUTPUT
            echo "task_def_file=stores/goorm-popcorn-dev-store-service.json" >> $GITHUB_OUTPUT
            echo "container_name=store-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "checkIns" ]; then
            echo "ecr_repo=goorm-popcorn-checkin" >> $GITHUB_OUTPUT
            echo "task_def_file=checkIns/goorm-popcorn-dev-checkin-service.json" >> $GITHUB_OUTPUT
            echo "container_name=checkin-service" >> $GITHUB_OUTPUT
          else
            echo "ecr_repo=goorm-popcorn-${{ matrix.service }}" >> $GITHUB_OUTPUT
            echo "task_def_file=${{ matrix.service }}/goorm-popcorn-dev-${{ matrix.service }}.json" >> $GITHUB_OUTPUT
            echo "container_name=${{ matrix.service }}-service" >> $GITHUB_OUTPUT
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: ${{ matrix.service }}/build/libs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

    # 1️⃣ 안전한 8자리 SHA 및 디스플레이 태그 생성
      - name: Generate build metadata
        id: build_meta
        run: |
          SHA8=$(echo ${GITHUB_SHA} | cut -c1-8)
          echo "sha8=$SHA8" >> $GITHUB_OUTPUT
          
          # 알림용 디스플레이 태그 결정
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "display_tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "display_tag=dev-latest" >> $GITHUB_OUTPUT
          else
            # ci-tag 같은 기타 브랜치는 브랜치명 자체를 태그로 사용
            echo "display_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # 1-1. 자동으로 다음 버전 계산 (커밋 메시지 분석)
      - name: Bump version and push tag
        id: tag_version
        if: github.ref_name == 'main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # 기본적으로 Patch 숫자(마지막 숫자) 증가

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}
          tags: |
            # Production 전략 (main 전용)
            type=raw,value=${{ steps.tag_version.outputs.new_tag }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            
            # Development 전략 (develop 및 ci-tag 전용)
            type=raw,value=dev-${{ steps.build_meta.outputs.sha8 }},enable=${{ github.ref_name == 'develop' }}
            type=raw,value=dev-latest,enable=${{ github.ref_name == 'develop' }}
            
            # 공통: Semantic Versioning
            type=semver,pattern={{version}}
          flavor: |
            latest=false


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false

          # dev-latest 태그 적용
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}:test-${{ github.run_number }}


          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,oci-mediatypes=true

      - name: Notify Discord (success)
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ Deploy SUCCESS by.yeon
            - 👤 Author: `${{ github.actor }}`
            - Service: ${{ matrix.service }}
            - Repo: ${{ steps.vars.outputs.ecr_repo }}
            - Image: ${{ steps.ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}:dev-latest
            - Run: #${{ github.run_number }}
            - Commit: ${{ github.sha }}

      - name: Notify Discord (failure)
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ Deploy FAILED by.yeon
            - 👤 Author: `${{ github.actor }}`
            - Service: ${{ matrix.service }}
            - Repo: ${{ steps.vars.outputs.ecr_repo }}
            - Run: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            // - Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
  
  update-gitops-values:
    name: Update GitOps values (single commit)
    needs: [detect-changes, docker-build-push-ecr]
    if: github.event_name == 'push' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read 

    env:
      GITOPS_REPO: ProfectProject/popcorn_deploy
      GITOPS_BRANCH: argo 
      VALUES_FILE: helm/popcorn-umbrella/values-dev.yaml
      IMAGE_TAG: test-${{ github.run_number }}

    steps:
      - name: Install tools (jq, yq)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
          jq --version

      - name: Clone GitOps repo
        shell: bash
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          git checkout "${GITOPS_BRANCH}"

      - name: Update values-dev.yaml for changed services only
        shell: bash
        run: |
          set -euo pipefail

          SERVICES_JSON='${{ needs.detect-changes.outputs.services_json }}'
          echo "Changed services json: ${SERVICES_JSON}"
          echo "Using IMAGE_TAG=${IMAGE_TAG}"

          cd gitops

          # 변경된 서비스 목록을 순회하면서 values-dev.yaml의 service.image.tag만 갱신
          # services_json 예: ["users","order","gateway"]
          echo "${SERVICES_JSON}" | jq -r '.[]' | while read -r svc; do
            case "$svc" in
              users)      key="users" ;;
              stores)     key="stores" ;;
              order)      key="order" ;;
              orderQuery) key="orderQuery" ;;
              payment)    key="payment" ;;
              gateway)    key="gateway" ;;
              checkIns)   key="checkIns" ;;
              *)
                echo "Unknown service key: $svc"
                exit 1
                ;;
            esac

            echo "Updating .${key}.image.tag -> ${IMAGE_TAG}"
            yq -i ".${key}.image.tag = \"${IMAGE_TAG}\"" "${VALUES_FILE}"
          done

          echo "---- diff ----"
          git diff -- "${VALUES_FILE}" || true

      - name: Commit & push (single commit)
        shell: bash
        run: |
          set -euo pipefail
          cd gitops

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # 커밋 메시지에 변경된 서비스들 넣기
          SERVICES_CSV=$(echo '${{ needs.detect-changes.outputs.services_json }}' | jq -r 'join(",")')

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add "${VALUES_FILE}"
          git commit -m "chore(gitops): bump image tags (${SERVICES_CSV}) -> ${IMAGE_TAG}"
          git push origin "${GITOPS_BRANCH}"
