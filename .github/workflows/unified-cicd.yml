name: Unified CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: ['**']

permissions:
  contents: read
  id-token: write

jobs:
  # [1] 변화 감지
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.set-matrix.outputs.services_json }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths (services)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users:
              - 'users/**'
            stores:
              - 'stores/**'
            order:
              - 'order/**'
            orderQuery:
              - 'orderQuery/**'
            payment:
              - 'payment/**'
            gateway:
              - 'gateway/**'
            checkIns:
              - 'checkIns/**'
            common-lib:
              - 'common-lib/**'
            build-config:
              - 'gradle/**'
              - '*.gradle'
              - 'gradle.properties'
              - '.github/workflows/unified-cicd.yml'

      - name: Build matrix output
        id: set-matrix
        shell: bash
        run: |
          services=()

          if [[ "${{ steps.filter.outputs.users }}" == "true" ]]; then
            services+=("users")
          fi
          if [[ "${{ steps.filter.outputs.order }}" == "true" ]]; then
            services+=("order")
          fi
          if [[ "${{ steps.filter.outputs.payment }}" == "true" ]]; then
            services+=("payment")
          fi
          if [[ "${{ steps.filter.outputs.orderQuery }}" == "true" ]]; then
            services+=("orderQuery")
          fi
          if [[ "${{ steps.filter.outputs.stores }}" == "true" ]]; then
            services+=("stores")
          fi
          if [[ "${{ steps.filter.outputs.gateway }}" == "true" ]]; then
            services+=("gateway")
          fi
          if [[ "${{ steps.filter.outputs.checkIns }}" == "true" ]]; then
            services+=("checkIns")
          fi

          if [[ "${{ steps.filter.outputs.common-lib }}" == "true" ]] || [[ "${{ steps.filter.outputs.build-config }}" == "true" ]]; then
            services=("users" "stores" "order" "orderQuery" "payment" "gateway" "checkIns")
          fi
          if [[ ${#services[@]} -eq 0 ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            {
              echo "services_json<<EOF"
              echo "[]"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # JSON 배열 만들기
          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s .)

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "services_json<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Debug outputs
        run: |
          echo "has_changes=${{ steps.set-matrix.outputs.has_changes }}"
          echo "services_json=${{ steps.set-matrix.outputs.services_json }}"

  test:
    name: Test (matrix)
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Testing service: ${{ matrix.service }}"
          if [ -d "${{ matrix.service }}" ]; then
            ./gradlew :${{ matrix.service }}:test -x javadoc --build-cache --configuration-cache --parallel
          else
            echo "Directory not found for service: ${{ matrix.service }} (skipping)"
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4"
          DB_HOST: localhost
          SPRING_PROFILES_ACTIVE: test

  # [2] 서비스 빌드
  build-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    name: Build ${{ matrix.service }} Module
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Module
        # ✅ 하드코딩된 :users 대신 matrix 변수 사용
        run: ./gradlew :${{ matrix.service }}:bootJar -x test -x javadoc --build-cache --configuration-cache --parallel
        env:
          DB_HOST: localhost
          SPRING_PROFILES_ACTIVE: test
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: ${{ matrix.service }}/build/libs/
          retention-days: 7

  # [3] Docker 빌드 및 푸시
  docker-build-push-ecr:
    needs: [detect-changes, build-service] # ✅ detect-changes가 필요함
    if: github.event_name == 'push' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ✅ 여기서도 matrix를 정의해야 ${{ matrix.service }}를 사용할 수 있습니다.
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    name: Push ${{ matrix.service }} to ECR

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn-user
      ECR_ORDER_REPOSITORY: goorm-popcorn-order
      ECR_GATEWAY_REPOSITORY: goorm-popcorn-api-gateway

      ECS_TASK_DEFINITION: users/goorm-popcorn-dev-user-service-revision2.json
      ECS_TASK_ORDER_DEFINITION: order/goorm-popcorn-dev-order-service.json
      ECS_TASK_GATEWAY_DEFINITION: gateway/goorm-popcorn-dev-api-gateway.json

      CONTAINER_NAME: user-service
      CONTAINER_ORDER_NAME: order-service
      CONTAINER_GATEWAY_NAME: api-gateway

      ECS_SERVICE: goorm-popcorn-dev-user-service
      ECS_ORDER_SERVICE: goorm-popcorn-dev-order-service
      ECS_APIGATE_SERVICE: goorm-popcorn-dev-api-gateway

      ECS_CLUSTER: goorm-popcorn-dev-cluster

      DB_HOST: localhost
      DB_PORT: 5430
      DB_NAME: popcorn_db

      ORDER_DB_USERNAME: order_app
      ORDER_DB_PASSWORD: order321
      ORDER_FLYWAY_USERNAME: order_migrator
      ORDER_FLYWAY_PASSWORD: order321

      ORDER_QUERY_DB_USERNAME: order_query_app
      ORDER_QUERY_DB_PASSWORD: quary123

      ORDER_QUERY_FLYWAY_USERNAME: order_query_migrator
      ORDER_QUERY_FLYWAY_PASSWORD: quary321


      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==PASSPORT_SECRET=passport-shared-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ 서비스별 변수 동적 매핑 (여기에 order와 gateway 설정을 모두 넣습니다)
      - name: Set service-specific variables
        id: vars
        run: |
          if [ "${{ matrix.service }}" == "order" ]; then
            echo "ecr_repo=goorm-popcorn-order" >> $GITHUB_OUTPUT
            echo "task_def_file=order/goorm-popcorn-dev-order-service.json" >> $GITHUB_OUTPUT
            echo "container_name=order-service" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-order-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "gateway" ]; then
            echo "ecr_repo=goorm-popcorn-api-gateway" >> $GITHUB_OUTPUT
            echo "task_def_file=gateway/goorm-popcorn-dev-api-gateway.json" >> $GITHUB_OUTPUT
            echo "container_name=api-gateway" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-api-gateway" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "users" ]; then
            echo "ecr_repo=goorm-popcorn-user" >> $GITHUB_OUTPUT
            echo "task_def_file=users/goorm-popcorn-dev-user-service-revision2.json" >> $GITHUB_OUTPUT
            echo "container_name=user-service" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-user-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "orderQuery" ]; then
            echo "ecr_repo=goorm-popcorn-order-query" >> $GITHUB_OUTPUT
            echo "task_def_file=orderQuery/goorm-popcorn-dev-order-query.json" >> $GITHUB_OUTPUT
            echo "container_name=order-query" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-order-query" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "payment" ]; then
            echo "ecr_repo=goorm-popcorn-payment" >> $GITHUB_OUTPUT
            echo "task_def_file=payment/goorm-popcorn-dev-payment-service.json" >> $GITHUB_OUTPUT
            echo "container_name=payment-service" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-payment-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "stores" ]; then
            echo "ecr_repo=goorm-popcorn-store" >> $GITHUB_OUTPUT
            echo "task_def_file=stores/goorm-popcorn-dev-store-service.json" >> $GITHUB_OUTPUT
            echo "container_name=store-service" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-store-service" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" == "checkIns" ]; then
            echo "ecr_repo=goorm-popcorn-checkin" >> $GITHUB_OUTPUT
            echo "task_def_file=checkIns/goorm-popcorn-dev-checkin-service.json" >> $GITHUB_OUTPUT
            echo "container_name=checkin-service" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-checkin-service" >> $GITHUB_OUTPUT
          else
            echo "ecr_repo=goorm-popcorn-${{ matrix.service }}" >> $GITHUB_OUTPUT
            echo "task_def_file=${{ matrix.service }}/goorm-popcorn-dev-${{ matrix.service }}.json" >> $GITHUB_OUTPUT
            echo "container_name=${{ matrix.service }}-service" >> $GITHUB_OUTPUT
            echo "ecs_service=goorm-popcorn-dev-${{ matrix.service }}-service" >> $GITHUB_OUTPUT
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: ${{ matrix.service }}/build/libs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false

          # ✅ 요청하신 dev-latest 태그 적용
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}:dev-latest
            ${{ steps.ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}:test-${{ github.run_number }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,oci-mediatypes=true

      - name: Download Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.vars.outputs.task_def_file }} \
            --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy)' > task-definition.json  

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: ${{ steps.vars.outputs.task_def_file }}
          container-name: ${{ steps.vars.outputs.container_name }}
          image: ${{ steps.vars.outputs.ecr_repo }}:dev-latest

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.vars.outputs.task_def_file }}
          service: ${{ steps.vars.outputs.ecs_service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Notify Discord (success)
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ Deploy SUCCESS by.yeon
            - 👤 Author: `${{ github.actor }}`
            - Service: ${{ matrix.service }}
            - Repo: ${{ steps.vars.outputs.ecr_repo }}
            - Image: ${{ steps.ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}:dev-latest
            - Run: #${{ github.run_number }}
            - Commit: ${{ github.sha }}

      - name: Notify Discord (failure)
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ Deploy FAILED by.yeon
            - 👤 Author: `${{ github.actor }}`
            - Service: ${{ matrix.service }}
            - Repo: ${{ steps.vars.outputs.ecr_repo }}
            - Run: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            // - Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
