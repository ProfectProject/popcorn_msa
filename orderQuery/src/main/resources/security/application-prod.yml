server:
  port: 8087
  shutdown: immediate
  tomcat:
    threads:
      max: ${ORDERQUERY_TOMCAT_MAX_THREADS:300}
      min-spare: ${ORDERQUERY_TOMCAT_MIN_SPARE_THREADS:30}
    accept-count: ${ORDERQUERY_TOMCAT_ACCEPT_COUNT:200}
  connection-timeout: ${ORDERQUERY_SERVER_CONNECTION_TIMEOUT:30s}
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: "off"
    log-startup-info: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${ORDER_QUERY_USERNAME}
    password: ${ORDER_QUERY_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${ORDERQUERY_DB_MAX_POOL_SIZE:30}
      minimum-idle: ${ORDERQUERY_DB_MIN_IDLE:10}
      connection-timeout: ${ORDERQUERY_DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${ORDERQUERY_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${ORDERQUERY_DB_MAX_LIFETIME_MS:1800000}
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: VARCHAR

  cache:
    type: redis

  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${ORDER_QUERY_FLYWAY_USERNAME}
    password: ${ORDER_QUERY_FLYWAY_PASSWORD}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration/schema
    default-schema: order_query
    schemas: order_query
    clean-disabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: ${ORDER_QUERY_KAFKA_GROUP}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

popcorn:
  kafka:
    topics:
      order-events: ${KAFKA_TOPIC_ORDER_EVENTS:order-events}
      payment-events: ${KAFKA_TOPIC_PAYMENT_EVENTS:payment-events}
      store-events: ${KAFKA_TOPIC_STORE_EVENTS:store-events}
      checkin-events: ${KAFKA_TOPIC_CHECKIN_EVENTS:checkin-events}
springdoc:
  server-url: ${GATEWAY_SERVICE_URL}

passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

order-query:
  dashboard:
    resolve-user-names: ${ORDERQUERY_RESOLVE_USER_NAMES:false}
    max-page-size: ${ORDERQUERY_MAX_PAGE_SIZE:50}

logging:
  level:
    root: WARN
    com.example.orderquery: INFO
    com.popcorn.common: INFO
    org.springframework.data.repository.config: WARN
    org.flywaydb.core.internal.database.base.Database: ERROR
    org.hibernate.SQL: WARN
    com.example.orderquery.domain.summary.event.PopupSummaryEventListener: WARN
