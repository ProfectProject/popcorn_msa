server:
  port: 8087
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000ms
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          enabled: true
          max-active: 20
          max-wait: -1ms
          max-idle: 5
          min-idle: 0
  datasource:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
      username: ${ORDER_USERNAME:order_query_app}
      password: ${ORDER_PASSWORD:quary123}
      driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: order_query
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  cache:
    type: redis  # Redis 캐시 사용

  flyway:
    enabled: true
    user: ${ORDER_QUERY_FLYWAY_USERNAME:order_query_migrator}
    password: ${ORDER_QUERY_FLYWAY_PASSWORD:quary321}
    default-schema: order_query
    schemas: order_query
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    consumer:
      group-id: ${ORDER_QUERY_KAFKA_GROUP:order-query-cg}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

popcorn:
  kafka:
    topics:
      order-events: ${KAFKA_TOPIC_ORDER_EVENTS:order-events}
      payment-events: ${KAFKA_TOPIC_PAYMENT_EVENTS:payment-events}
      store-events: ${KAFKA_TOPIC_STORE_EVENTS:store-events}
      checkin-events: ${KAFKA_TOPIC_CHECKIN_EVENTS:checkin-events}
jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.popcorn.store: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG


passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60


