server:
  port: 8087
  shutdown: immediate
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${ORDER_QUERY_USERNAME}
    password: ${ORDER_QUERY_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: VARCHAR

  cache:
    type: simple

  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${ORDER_QUERY_FLYWAY_USERNAME}
    password: ${ORDER_QUERY_FLYWAY_PASSWORD}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration/schema
    default-schema: order_query
    schemas: order_query
    clean-disabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: ${ORDER_QUERY_KAFKA_GROUP}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual
      concurrency: ${KAFKA_LISTENER_CONCURRENCY}

popcorn:
    kafka:
      topics:
        order-events: ${KAFKA_TOPIC_ORDER_EVENTS:order-events}
        payment-events: ${KAFKA_TOPIC_PAYMENT_EVENTS:payment-events}
        store-events: ${KAFKA_TOPIC_STORE_EVENTS:store-events}
        checkin-events: ${KAFKA_TOPIC_CHECKIN_EVENTS:checkin-events}
springdoc:
  server-url: ${GATEWAY_SERVICE_URL}

passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
