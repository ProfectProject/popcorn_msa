[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Path_Key          log_path

# log_path에서 container_id 추출
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log_path
    Parser       path_container_id
    Reserve_Data On

# 원래 log(JSON) 안쪽 파싱
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       json
    Reserve_Data On

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log fluent-bit

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log loki

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log grafana

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log component=querier

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log component=frontend

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log MetadataLoader

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log JmxMetricsRetriever

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log logger=provisioning

[FILTER]
    Name   grep
    Match  docker.*
    Exclude log logger=migrator

[OUTPUT]
    Name        loki
    Match       docker.*
    Host        loki
    Port        3100
    labels      container_id=$container_id,stream=$stream
    line_format json
