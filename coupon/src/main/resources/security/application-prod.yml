# =================================================================
# 🎫 Coupon Service Production Security Configuration
# =================================================================

server:
  port: 8088
  shutdown: graceful

  # 🚨 Emergency Tomcat 극한 최적화 - 1800 RPS 대응
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 2000                    # 🚨 Emergency: 극한 스레드 수
      min-spare: 500              # 🚨 Emergency: 최소 스레드 500개
    connection-timeout: 60000      # 🚨 Emergency: 60초 타임아웃
    keep-alive-timeout: 60000      # 🚨 Emergency: Keep-Alive 60초
    max-connections: 100000        # 🚨 Emergency: 최대 연결 수 100K
    accept-count: 5000            # 🚨 Emergency: 대기 연결 수 5K
    max-http-form-post-size: 2MB  # POST 크기 제한

spring:
  config:
    activate:
      on-profile: prod

  # 데이터베이스 설정 (Production 환경용)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=coupons
    username: ${COUPON_USERNAME}
    password: ${COUPON_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # 🚨 Emergency HikariCP 극한 최적화 - 1800 RPS 대응
    hikari:
      connection-init-sql: SET search_path TO coupons
      maximum-pool-size: 2000        # 🚨 EXTREME: 1000 → 2000 (800 RPS 대응)
      minimum-idle: 800              # 🚨 EXTREME: 400 → 800
      connection-timeout: 15000      # 🚨 Emergency: 30s → 15s
      validation-timeout: 5000       # 🚨 Emergency: 검증 타임아웃 5초
      idle-timeout: 300000          # 🚨 Emergency: 10분 → 5분
      max-lifetime: 900000           # 🚨 Emergency: 30분 → 15분
      leak-detection-threshold: 15000 # 🚨 Emergency: 60s → 15s
      pool-name: "CouponHikariPool"
      connection-test-query: SELECT 1 # 연결 테스트 쿼리
      keepalive-time: 30000          # 🚨 Emergency: Keep alive 30초

  # JPA 설정 (Production 최적화)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false        # SQL 주석 비활성화 (성능)
        show_sql: false                # SQL 로깅 비활성화 (성능)
        default_schema: coupons
        jdbc:
          batch_size: 100              # 🚨 Emergency: 50 → 100 (극한 배치)
          batch_versioned_data: true   # 버전 데이터 배치 처리
          fetch_size: 100              # 페치 크기 증가
          order_inserts: true          # INSERT 순서 최적화
          order_updates: true          # UPDATE 순서 최적화
        default_batch_fetch_size: 200
        # JCache 의존성 미탑재 환경에서도 안정 기동되도록 L2/Query 캐시 비활성화
        cache:
          use_second_level_cache: false
          use_query_cache: false
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  # Flyway 설정 (Production)
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${COUPON_FLYWAY_USERNAME}
    password: ${COUPON_FLYWAY_PASSWORD}
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
    default-schema: coupons
    schemas: coupons

  # Redis 설정 (Production)
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 5000ms              # 🚨 Emergency: 2s → 5s (더 긴 타임아웃)
      command-timeout: 5000ms       # 🚨 Emergency: 2s → 5s
      # 🚨 Emergency Redis 극한 최적화 - 1800 RPS 대응
      lettuce:
        pool:
          max-active: 2000          # 🚨 Emergency: 50 → 2000 (극한)
          max-idle: 1000            # 🚨 Emergency: 20 → 1000 (극한)
          min-idle: 500             # 🚨 Emergency: 10 → 500 (극한)
          max-wait: 60000ms         # 🚨 Emergency: 3s → 60s (더 긴 대기)
          time-between-eviction-runs: 60000ms
          min-evictable-idle-time: 300000ms
          test-on-borrow: false     # 성능 향상
          test-on-return: false     # 성능 향상
          test-while-idle: true     # 유휴 중 검사만 활성화
        shutdown-timeout: 1000ms     # Emergency: 2s → 1s

  # Kafka 설정 (Production)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      retries: 10
      batch-size: 32768
      linger-ms: 5
      buffer-memory: 67108864
      properties:
        retry.backoff.ms: 2000
        compression.type: snappy
    consumer:
      group-id: coupon-service-group
      fetch-min-size: 32768
      fetch-max-wait: 500ms
      properties:
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000
        max.poll.records: 100

# 인증 설정 (Production)
passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 30

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000  # 30분 (보안 강화)
  refresh-expiration-ms: 86400000  # 24시간

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# 커스텀 쿠폰 설정 (Production)
coupon:
  cache:
    ttl:
      user-limit: 3600     # 1시간
      stock: 600           # 10분
      processed-event: 86400   # 1일
  redis:
    key-prefix: "coupon:"
    lock-timeout: 2000   # 2초 (빠른 실패)
  batch:
    expire-batch-size: 500
    expire-schedule: "0 */10 * * * *"  # 10분마다
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 1800000  # 30분 (보안 강화)

logging:
  level:
    com.popcorn.coupon: WARN
    org.springframework.security: ERROR
    org.springframework.kafka: ERROR
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  server:
    port: 9088
