server:
  port: 8088
  shutdown: immediate

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:popcorn_db}?currentSchema=coupons
    username: ${COUPON_USERNAME:coupon_app}
    password: ${COUPON_PASSWORD:coupon123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: coupons
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  flyway:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    user: ${COUPON_FLYWAY_USERNAME:coupon_migrator}
    password: ${COUPON_FLYWAY_PASSWORD:coupon321}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
    default-schema: coupons
    schemas: coupons

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      command-timeout: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
