# =================================================================
# 🎫 Coupon Service Local Security Configuration
# =================================================================

server:
  port: 8088
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8

spring:
  kafka:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    consumer:
      group-id: coupon-service-group
  config:
    activate:
      on-profile: local

  # 데이터베이스 설정 (로컬 환경용)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}?currentSchema=coupons
    username: ${COUPON_USERNAME:coupon_app}
    password: ${COUPON_PASSWORD:coupon123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000

  # JPA 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: coupons  # 쿠폰 서비스 전용 스키마
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  # Flyway 설정
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    user: ${COUPON_FLYWAY_USERNAME:coupon_migrator}
    password: ${COUPON_FLYWAY_PASSWORD:coupon_password}
    enabled: true
    locations: classpath:db/migration
    schemas: coupons  # 쿠폰 서비스 전용 스키마 사용
    default-schema: coupons
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    placeholders:
      COUPON_MIGRATOR_PASSWORD: ${COUPON_FLYWAY_PASSWORD:coupon_password}

  # Redis 설정
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1000ms
      command-timeout: 1000ms
      database: 0
      connection-timeout: 1000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
          time-between-eviction-runs: 60s
        shutdown-timeout: 2000ms

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 커스텀 쿠폰 설정
coupon:
  cache:
    ttl:
      user-limit: 86400  # 24시간
      stock: 3600        # 1시간
      processed-event: 604800  # 7일
  redis:
    key-prefix: "coupon:"
    lock-timeout: 5000
  batch:
    expire-batch-size: 1000
    expire-schedule: "0 */5 * * * *"  # 5분마다
  security:
    jwt:
      secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
      expiration: 3600000  # 1시간

logging:
  level:
    root: WARN
    com.popcorn.coupon: INFO
    org.springframework.web: WARN
    org.springframework.boot.web: WARN
    org.hibernate.SQL: INFO
    org.springframework.security: WARN
    org.apache.kafka: INFO
    org.springframework.kafka: INFO
