# PostgreSQL Configuration for Debezium CDC
# 쿠폰 서비스 CDC 최적화 설정

# WAL (Write-Ahead Logging) 설정 - Debezium 필수
wal_level = logical                    # CDC를 위한 logical replication 활성화
max_replication_slots = 10             # 복제 슬롯 최대 개수
max_wal_senders = 10                   # WAL 발신자 최대 개수
wal_sender_timeout = 60s               # WAL 발신자 타임아웃

# WAL 세그먼트 설정
wal_segsize = 16                       # WAL 세그먼트 크기 (MB)
min_wal_size = 80MB                    # 최소 WAL 크기
max_wal_size = 1GB                     # 최대 WAL 크기
wal_buffers = 16MB                     # WAL 버퍼 크기

# 복제 설정
hot_standby = on                       # 읽기 전용 연결 허용
hot_standby_feedback = on              # 피드백 활성화
wal_receiver_timeout = 60s             # WAL 수신자 타임아웃
max_standby_streaming_delay = 30s      # 스트리밍 지연 최대값

# 연결 설정
max_connections = 200                  # 최대 동시 연결 수
shared_buffers = 256MB                 # 공유 버퍼 크기
effective_cache_size = 1GB             # 효과적인 캐시 크기
work_mem = 4MB                         # 작업 메모리
maintenance_work_mem = 64MB            # 유지보수 작업 메모리

# 로깅 설정 (디버깅용)
log_destination = 'stderr'             # 로그 출력 위치
logging_collector = on                 # 로그 수집기 활성화
log_directory = 'log'                  # 로그 디렉토리
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d                  # 로그 회전 주기
log_rotation_size = 10MB               # 로그 파일 크기 제한
log_min_messages = info                # 최소 로그 레벨
log_min_error_statement = error        # 에러 로그 레벨
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# CDC 관련 추가 설정
log_replication_commands = on          # 복제 명령 로깅
wal_log_hints = on                     # WAL 힌트 로깅
track_commit_timestamp = on            # 커밋 타임스탬프 추적

# 성능 최적화
checkpoint_completion_target = 0.7     # 체크포인트 완료 목표
default_statistics_target = 100       # 통계 수집 목표
random_page_cost = 1.1                 # SSD 최적화
effective_io_concurrency = 200         # I/O 동시성

# 시간대 설정
timezone = 'Asia/Seoul'                # 한국 시간대
log_timezone = 'Asia/Seoul'            # 로그 시간대

# Autovacuum 설정 (성능 최적화)
autovacuum = on                        # 자동 정리 활성화
autovacuum_max_workers = 3             # 최대 워커 수
autovacuum_naptime = 1min              # 실행 주기
autovacuum_vacuum_threshold = 50       # 정리 임계값
autovacuum_analyze_threshold = 50      # 분석 임계값
autovacuum_vacuum_scale_factor = 0.1   # 정리 비율
autovacuum_analyze_scale_factor = 0.05 # 분석 비율

# 메모리 설정
shared_preload_libraries = ''          # 사전 로드 라이브러리
dynamic_shared_memory_type = posix     # 동적 공유 메모리 타입

# 기타 설정
listen_addresses = '*'                 # 모든 주소에서 연결 허용
port = 5432                           # 포트 번호
max_locks_per_transaction = 64        # 트랜잭션당 최대 락 수
max_pred_locks_per_transaction = 64   # 예측 락 수