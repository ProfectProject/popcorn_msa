server:
  port: 8082
  shutdown: immediate
  # 🚨 Emergency Tomcat 극한 최적화 - 5xx 에러 해결
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000                    # 🚨 Emergency: 대폭 증가
      min-spare: 200              # 🚨 최소 스레드 대폭 증가
    connection-timeout: 60000      # 🚨 60초 타임아웃
    keep-alive-timeout: 60000      # 🚨 Keep-Alive 연장
    max-connections: 50000         # 🚨 최대 연결 수 대폭 증가
    accept-count: 2000            # 🚨 대기 연결 수 대폭 증가
spring:
  kafka:
    enabled: true
    bootstrap-servers: localhost:29092
    consumer:
      group-id: user-service-group
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      connection-timeout: 1000ms  # 최적화: 연결 타임아웃 1초
      # 🚨 Emergency Redis 극한 최적화 - 5xx 에러 해결
      lettuce:
        pool:
          max-active: 1000          # 🚨 Emergency: 8 → 1000
          max-idle: 500             # 🚨 Emergency: 8 → 500
          min-idle: 200             # 🚨 Emergency: 0 → 200
          max-wait: 30000ms         # 🚨 Emergency: -1 → 30초
          time-between-eviction-runs: 60000ms # 유휴 연결 정리 주기
          min-evictable-idle-time: 300000ms # 최소 유휴 시간
        shutdown-timeout: 1000ms     # Emergency: 100ms → 1초

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${USER_AUTH_USERNAME:user_auth_app}
    password: ${USER_AUTH_PASSWORD:user_auth123}
    driver-class-name: org.postgresql.Driver
    # 🚨 Emergency HikariCP 극한 최적화 - 5xx 에러 해결
    hikari:
      maximum-pool-size: 500         # 🚨 Emergency: 대폭 증가
      minimum-idle: 200              # 🚨 Emergency: 최소 유휴 대폭 증가
      connection-timeout: 10000      # 🚨 Emergency: 연결 타임아웃 10초
      idle-timeout: 300000           # 🚨 Emergency: 유휴 타임아웃 5분
      max-lifetime: 900000           # 🚨 Emergency: 최대 수명 15분
      leak-detection-threshold: 30000 # 🚨 Emergency: 누수 감지 30초
      connection-test-query: SELECT 1 # 연결 테스트 쿼리
      keepalive-time: 30000          # 🚨 Emergency: Keep alive 30초
      validation-timeout: 5000       # 🚨 Emergency: 검증 타임아웃 5초

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_auth
        dialect: org.hibernate.dialect.PostgreSQLDialect
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        # 🚀 JPA 배치 및 성능 최적화 - 5xx 에러 해결
        jdbc:
          batch_size: 50              # 배치 처리 크기
          batch_versioned_data: true  # 버전 데이터 배치 처리
          fetch_size: 50              # 페치 크기
        order_inserts: true           # INSERT 순서 최적화
        order_updates: true           # UPDATE 순서 최적화
        format_sql: false             # SQL 포맷팅 비활성화 (성능)
        use_sql_comments: false       # SQL 주석 비활성화 (성능)
        show_sql: false              # SQL 로깅 비활성화 (성능)
        # 🚀 L2 캐시 활성화
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

  cache:
    type: simple

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    user:  ${USER_AUTH_FLYWAY_USERNAME:user_auth_migrator}
    password: ${USER_AUTH_FLYWAY_PASSWORD:user321}
    schemas: user_auth
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    clean-disabled: false
app:
  gateway:
    url: ${GATEWAY_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

logging:
  level:
    # 🚀 성능 최적화: DEBUG → INFO/WARN - 5xx 에러 해결
    com.popcorn.demo: INFO          # DEBUG → INFO
    org.springframework.web: WARN      # DEBUG → WARN
    org.springframework.boot.web: WARN # DEBUG → WARN
    org.hibernate.SQL: WARN            # DEBUG → WARN (SQL 로깅 최소화)
    org.springframework.security: WARN # DEBUG → WARN
    com.adjh.springbootkafka: INFO     # DEBUG → INFO
    org:
      apache.kafka: WARN               # INFO → WARN
      springframework.kafka: WARN      # INFO → WARN
    root: WARN                         # 전체 로깅 레벨 최적화
