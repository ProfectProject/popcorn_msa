server:
  port: 8082
  shutdown: immediate
  # === 🚀 극한 부하 대응 Tomcat 최적화 ===
  tomcat:
    threads:
      max: 500                 # 극한 부하 대응 (200→500)
      min-spare: 50            # 최소 스레드 수 증가
    connection-timeout: 10000  # 연결 타임아웃 단축 (20s→10s)
    keep-alive-timeout: 30000  # Keep-Alive 타임아웃 최적화
    max-connections: 20000     # 최대 연결 수 확대 (8192→20000)
    accept-count: 500         # 대기 연결 수 확대 (100→500)
    max-http-form-post-size: 2MB  # POST 크기 제한
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: "off"
    log-startup-info: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 50         # 극한 부하 대응 (16→50)
          max-idle: 25          # 최대 idle 연결 (8→25)
          min-idle: 10          # 최소 idle 연결 (2→10)
          max-wait: 200         # 최대 대기 시간 단축 (5s→200ms)
        shutdown-timeout: 100ms
      timeout: 200ms            # 개별 명령 타임아웃 단축 (3s→200ms)
      connect-timeout: 200ms    # 연결 타임아웃 추가
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${USER_AUTH_USERNAME}
    password: ${USER_AUTH_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 80        # 극한 부하 대응 (20→80)
      minimum-idle: 20             # 최소 idle 연결 확보 (5→20)
      connection-timeout: 3000     # 연결 대기 시간 단축 (20s→3s)
      validation-timeout: 1000     # 검증 타임아웃 최적화
      idle-timeout: 300000         # idle 타임아웃 단축 (10분→5분)
      max-lifetime: 1200000        # 연결 최대 생명주기 단축 (30분→20분)
      leak-detection-threshold: 30000 # 연결 누수 감지 단축 (60s→30s)

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_auth
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        # 성능 최적화 설정
        jdbc:
          batch_size: 20              # 배치 쿼리 최적화
          fetch_size: 50              # 페치 크기 최적화
        cache:
          use_second_level_cache: false  # RegionFactory 미구성 환경에서는 비활성화
          use_query_cache: false
        connection:
          provider_disables_autocommit: true  # AutoCommit 비활성화로 성능 향상
        order_inserts: true               # INSERT 순서 최적화
        order_updates: true               # UPDATE 순서 최적화

  cache:
    type: simple

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user:  ${USER_AUTH_FLYWAY_USERNAME}
    password: ${USER_AUTH_FLYWAY_PASSWORD}
    schemas: user_auth
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

springdoc:
  server-url: ${GATEWAY_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
  # JWT 성능 최적화
  algorithm: HS256                 # 빠른 HMAC 알고리즘 명시
  issuer: popcorn-auth            # 발급자 명시
  cache-enabled: true             # JWT 캐싱 활성화
passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

logging:
  level:
    root: WARN                           # 프로덕션에서 WARNING 이상만
    com.popcorn.users: INFO             # 애플리케이션 로그는 INFO 유지
    com.popcorn.common: INFO            # 공통 모듈 INFO 유지
    com.zaxxer.hikari: WARN             # HikariCP 로그 최소화
    org.springframework.security: WARN   # Spring Security 로그 최소화
    org.hibernate: WARN                 # Hibernate 로그 최소화
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"  # 간결한 로그 패턴
app:
  gateway:
    url: ${GATEWAY_SERVICE_URL}
