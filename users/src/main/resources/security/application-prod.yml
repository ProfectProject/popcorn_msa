server:
  port: 8082
  shutdown: immediate
  # 🚨 Emergency Tomcat 극한 최적화 - 1800 RPS 대응
  tomcat:
    threads:
      max: 2000                    # 🚨 Emergency: 1000 → 2000
      min-spare: 500              # 🚨 Emergency: 200 → 500
    connection-timeout: 60000      # 🚨 Emergency: 10s → 60s
    keep-alive-timeout: 60000      # 🚨 Emergency: 30s → 60s
    max-connections: 100000        # 🚨 Emergency: 50000 → 100000
    accept-count: 5000            # 🚨 Emergency: 2000 → 5000
    max-http-form-post-size: 2MB  # POST 크기 제한
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: "off"
    log-startup-info: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 2000          # 🚨 Emergency: 1000 → 2000 (극한)
          max-idle: 1000            # 🚨 Emergency: 500 → 1000 (극한)
          min-idle: 500             # 🚨 Emergency: 200 → 500 (극한)
          max-wait: 60000ms         # 🚨 Emergency: 30초 → 60초 (더 긴 대기)
          time-between-eviction-runs: 60000ms
          min-evictable-idle-time: 300000ms
          test-on-borrow: false     # 성능 향상
          test-on-return: false     # 성능 향상
          test-while-idle: true     # 유휴 중 검사만 활성화
        shutdown-timeout: 1000ms     # Emergency: 100ms → 1초
      timeout: 5000ms            # 🚨 Emergency: 2초 → 5초 (더 긴 타임아웃)
      connect-timeout: 5000ms    # 🚨 Emergency: 1초 → 5초
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${USER_AUTH_USERNAME}
    password: ${USER_AUTH_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1000        # 🚨 Emergency: 500 → 1000 (1800 RPS 대응)
      minimum-idle: 400              # 🚨 Emergency: 200 → 400
      connection-timeout: 15000      # 🚨 Emergency: 10s → 15s
      validation-timeout: 5000       # 🚨 Emergency: 500ms → 5s
      idle-timeout: 300000           # 🚨 Emergency: 3분 → 5분
      max-lifetime: 900000           # 🚨 Emergency: 10분 → 15분
      leak-detection-threshold: 15000 # 🚨 Emergency: 30s → 15s 조정
      connection-test-query: SELECT 1 # 연결 테스트 쿼리
      keepalive-time: 30000          # 🚨 Emergency: Keep alive 30초

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_auth
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        # 🚀 JPA 극한 성능 최적화 설정
        jdbc:
          batch_size: 100             # 🚨 Emergency: 20 → 100 (극한 배치)
          batch_versioned_data: true  # 버전 데이터 배치 처리
          fetch_size: 100             # 🚨 Emergency: 50 → 100 (극한 페치)
        cache:
          use_second_level_cache: true   # 🚨 Emergency: L2 캐시 활성화
          use_query_cache: true          # 쿼리 캐시 활성화
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        connection:
          provider_disables_autocommit: true  # AutoCommit 비활성화로 성능 향상
        order_inserts: true               # INSERT 순서 최적화
        order_updates: true               # UPDATE 순서 최적화

  cache:
    type: simple

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user:  ${USER_AUTH_FLYWAY_USERNAME}
    password: ${USER_AUTH_FLYWAY_PASSWORD}
    schemas: user_auth
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

springdoc:
  server-url: ${GATEWAY_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
  # JWT 성능 최적화
  algorithm: HS256                 # 빠른 HMAC 알고리즘 명시
  issuer: popcorn-auth            # 발급자 명시
  cache-enabled: true             # JWT 캐싱 활성화
passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

logging:
  level:
    root: WARN                           # 프로덕션에서 WARNING 이상만
    com.popcorn.users: INFO             # 애플리케이션 로그는 INFO 유지
    com.popcorn.common: INFO            # 공통 모듈 INFO 유지
    com.zaxxer.hikari: WARN             # HikariCP 로그 최소화
    org.springframework.security: WARN   # Spring Security 로그 최소화
    org.hibernate: WARN                 # Hibernate 로그 최소화
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"  # 간결한 로그 패턴
app:
  gateway:
    url: ${GATEWAY_SERVICE_URL}
