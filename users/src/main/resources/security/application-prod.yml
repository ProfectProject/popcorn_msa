server:
  port: 8082
  shutdown: immediate
  # === 🚀 극한 부하 대응 Tomcat 최적화 ===
  tomcat:
    threads:
      max: 500                 # 극한 부하 대응 스레드 수 (200→500)
      min-spare: 50           # 최소 유지 스레드 증가
    connection-timeout: 10000  # 연결 타임아웃 단축 (20s→10s)
    keep-alive-timeout: 30000  # Keep-Alive 타임아웃 최적화
    max-connections: 20000      # 최대 동시 연결수 확대 (8192→20000)
    accept-count: 500          # 대기열 크기 확대 (100→500)
    max-http-form-post-size: 2MB  # POST 크기 제한
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: "off"
    log-startup-info: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      repositories:
        enabled: false
      # === 🚀 극한 부하 대응 Redis 최적화 ===
      lettuce:
        pool:
          max-active: 50         # Redis 연결 풀 크기 확대 (16→50)
          max-idle: 20          # 최대 idle 연결 증가 (8→20)
          min-idle: 5           # 최소 idle 연결 증가 (2→5)
          max-wait: 2000        # 최대 대기 시간 단축 (5s→2s)
        shutdown-timeout: 100ms
      timeout: 1000ms            # 개별 명령 타임아웃 단축 (3s→1s)
      connect-timeout: 500ms     # 연결 타임아웃 추가
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${USER_AUTH_USERNAME}
    password: ${USER_AUTH_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # === 🚀 극한 부하 대응 HikariCP 최적화 ===
    hikari:
      maximum-pool-size: 80        # 극한 부하 대응 연결 수 (20→80)
      minimum-idle: 20             # 최소 idle 연결 확보 (5→20)
      connection-timeout: 15000    # 연결 대기 시간 단축 (20s→15s)
      validation-timeout: 3000     # 검증 타임아웃 3초
      idle-timeout: 300000         # idle 타임아웃 5분 (10분→5분)
      max-lifetime: 1800000        # 연결 최대 생명주기 30분
      leak-detection-threshold: 60000 # 연결 누수 감지 60초
      register-mbeans: true        # JMX 모니터링 활성화
      pool-name: "UserHikariPool"  # 풀 이름 설정

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_auth
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        # 성능 최적화 설정
        jdbc:
          batch_size: 20              # 배치 쿼리 최적화
          fetch_size: 50              # 페치 크기 최적화
        cache:
          use_second_level_cache: false  # RegionFactory 미구성 환경에서는 비활성화
          use_query_cache: false
        connection:
          provider_disables_autocommit: true  # AutoCommit 비활성화로 성능 향상
        order_inserts: true               # INSERT 순서 최적화
        order_updates: true               # UPDATE 순서 최적화

  cache:
    type: simple

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user:  ${USER_AUTH_FLYWAY_USERNAME}
    password: ${USER_AUTH_FLYWAY_PASSWORD}
    schemas: user_auth
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

springdoc:
  server-url: ${GATEWAY_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
  # JWT 성능 최적화
  algorithm: HS256                 # 빠른 HMAC 알고리즘 명시
  issuer: popcorn-auth            # 발급자 명시
  cache-enabled: true             # JWT 캐싱 활성화
passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

# === 🚀 극한 부하 대응 로깅 최적화 ===
logging:
  level:
    root: ERROR                          # 극한 부하 대응 로깅 최소화 (WARN→ERROR)
    com.popcorn.users: WARN             # 애플리케이션 로그 최소화 (INFO→WARN)
    com.popcorn.common: WARN            # 공통 모듈 최소화 (INFO→WARN)
    com.zaxxer.hikari: ERROR            # HikariCP 로그 최소화 (WARN→ERROR)
    org.springframework.security: ERROR  # Spring Security 로그 최소화 (WARN→ERROR)
    org.springframework.web: ERROR       # Web 로그 최소화
    org.hibernate: ERROR                # Hibernate 로그 최소화 (WARN→ERROR)
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n"  # 더 간결한 로그 패턴

# === 🚀 극한 부하 대응 모니터링 ===
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,hikaricp  # 모니터링 엔드포인트
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true                     # Prometheus 메트릭 활성화
app:
  gateway:
    url: ${GATEWAY_SERVICE_URL}
