spring:
  config:
    import:
      - optional:classpath:security/application-local.yml
      - optional:file:.env[.properties]
      - optional:file:gateway/.env[.properties]
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000    # 다운스트림 서비스 연결되는데 걸리는 시간
            response-timeout: 10s    # 응답시간 초과 (5s → 10s 증가)

      routes:
        - id: checkIns
          uri: ${CHECKIN_SERVICE_URL}     # checkIns 모듈
          predicates:
            - Path=/api/qr/**  # QR 관련 요청은 checkIns로
          filters:
            - RewritePath=^/api/qr/(?<remaining>swagger-ui.*), /${remaining}
            # 1) CircuitBreaker (Resilience4j 인스턴스명 연결)
            - name: CircuitBreaker
              args:
                name: cbCheckInService
                fallbackUri: forward:/fallback/checkIn-service
            # 2) Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true

        - id: checkin-docs
          uri: ${CHECKIN_SERVICE_URL}
          predicates:
            - Path=/api/checkins/**   # checkins docs + APIs
          filters:
            - RewritePath=^/api/checkins/(?<remaining>v3/api-docs.*), /${remaining}
            - RewritePath=^/api/checkins/(?<remaining>swagger-ui.*), /${remaining}
            - RewritePath=^/api/checkins/(?<remaining>webjars.*), /${remaining}
            # 1) CircuitBreaker (Resilience4j 인스턴스명 연결)
            - name: CircuitBreaker
              args:
                name: cbCheckInDocService
                fallbackUri: forward:/fallback/checkin-doc-service
            # 2) Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true

        - id: backend
          uri: ${BACKEND_SERVICE_URL}     # 모놀리식 backend
          predicates:
            - Path=/api/v1/**               # /api 로 시작하면 backend로 라우팅

        - id: user-service
          uri: ${USER_SERVICE_URL}     # 모놀리식 backend
          predicates:
            - Path=/api/users/**          # user-service
          filters:
            - RewritePath=^/api/users/(?<remaining>v3/api-docs.*), /${remaining}
            - RewritePath=^/api/users/(?<remaining>swagger-ui.*), /${remaining}
            - RewritePath=^/api/users/(?<remaining>webjars.*), /${remaining}
            # Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true

        # Payment 서비스에서 User API 호출용 라우팅
        - id: user-api
          uri: ${USER_SERVICE_URL}     # User 서비스
          predicates:
            - Path=/api/user/**          # user (단수형)
          filters:
            # Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true

        - id: stores
          uri: ${STORE_SERVICE_URL}
          predicates:
            - Path=/api/stores/**         # stores
          filters:
            - RewritePath=^/api/stores/(?<remaining>v3/api-docs.*), /${remaining}
            - RewritePath=^/api/stores/(?<remaining>swagger-ui.*), /${remaining}
            - RewritePath=^/api/stores/(?<remaining>webjars.*), /${remaining}
            # Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true

        - id: order
          uri: ${ORDER_SERVICE_URL}    # Order 서비스
          predicates:
            - Path=/api/orders/**         # orders
          filters:
            - RewritePath=^/api/orders/(?<remaining>v3/api-docs.*), /${remaining}
            - RewritePath=^/api/orders/(?<remaining>swagger-ui.*), /${remaining}
            - RewritePath=^/api/orders/(?<remaining>webjars.*), /${remaining}
            # 1) CircuitBreaker (Resilience4j 인스턴스명 연결)
            - name: CircuitBreaker
              args:
                name: cbOrderService
                fallbackUri: forward:/fallback/order-service
            # 2) Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true

        # Payment 서비스에서 Order API 호출용 라우팅
        - id: order-api
          uri: ${ORDER_SERVICE_URL}    # Order 서비스
          predicates:
            - Path=/api/order/**         # order (단수형)
          filters:
            # 1) CircuitBreaker (Resilience4j 인스턴스명 연결)
            - name: CircuitBreaker
              args:
                name: cbOrderService
                fallbackUri: forward:/fallback/order-service
            # 2) Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true

        - id: payment
          uri: ${PAYMENT_SERVICE_URL}    # Payment 서비스
          predicates:
            - Path=/api/payments/**       # payments
          filters:
            - RewritePath=^/api/payments/(?<remaining>v3/api-docs.*), /${remaining}
            - RewritePath=^/api/payments/(?<remaining>swagger-ui.*), /${remaining}
            - RewritePath=^/api/payments/(?<remaining>webjars.*), /${remaining}
        - id: payment-pay
          uri: ${PAYMENT_SERVICE_URL}     # Payment 서비스 (/api/pay 경로)
          predicates:
            - Path=/api/pay/**            # pay
          filters:
            - RewritePath=^/api/pay/(?<remaining>v3/api-docs.*), /${remaining}
            - RewritePath=^/api/pay/(?<remaining>swagger-ui.*), /${remaining}
            - RewritePath=^/api/pay/(?<remaining>webjars.*), /${remaining}
        - id: orderQuery
          uri: ${ORDERQUERY_SERVICE_URL}
          predicates:
            - Path=/api/orderquery/**    # order query
          filters:
            - RewritePath=^/api/orderquery/(?<remaining>v3/api-docs.*), /${remaining}
            - RewritePath=^/api/orderquery/(?<remaining>swagger-ui.*), /${remaining}
            - RewritePath=^/api/orderquery/(?<remaining>webjars.*), /${remaining}
            # 1) CircuitBreaker (Resilience4j 인스턴스명 연결)
            - name: CircuitBreaker
              args:
                name: cbOrderQueryService
                fallbackUri: forward:/fallback/orderQuery-service
            # 2) Retry (Gateway 필터로만 적용) --> 서버 5xx / 502/504 만 재시도
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 80ms
                  maxBackoff: 200ms
                  factor: 2
                  basedOnPreviousValue: true
  webflux:
    base-path: /

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

passport:
  secret: my-super-secret-key-for-popcorn-msa-development-only-do-not-use-in-production
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: ${GATEWAY_SERVICE_URL}/api/users/v3/api-docs
      - name: stores-public
        url: ${GATEWAY_SERVICE_URL}/api/stores/v3/api-docs/public
      - name: stores-owner
        url: ${GATEWAY_SERVICE_URL}/api/stores/v3/api-docs/owner
      - name: checkIns
        url: ${GATEWAY_SERVICE_URL}/api/checkins/v3/api-docs
      - name: order-service
        url: ${GATEWAY_SERVICE_URL}/api/orders/v3/api-docs
      - name: payment-service
        url: ${GATEWAY_SERVICE_URL}/api/payments/v3/api-docs
      - name: orderQuery
        url: ${GATEWAY_SERVICE_URL}/api/orderquery/v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      cbUserService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 30
        failure-rate-threshold: 20
        slow-call-duration-threshold: 2000ms  # 300ms → 2000ms로 증가
        slow-call-rate-threshold: 40
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

      cbStoreService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 30
        failure-rate-threshold: 20
        slow-call-duration-threshold: 3000ms  # 300ms → 3000ms (3초로 증가)
        slow-call-rate-threshold: 40
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

      cbOrderService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 30
        failure-rate-threshold: 20
        slow-call-duration-threshold: 8s    # 3s → 8s 증가
        slow-call-rate-threshold: 40
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

      cbPaymentService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 20
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

      cbCheckInService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 30
        failure-rate-threshold: 20
        wait-duration-in-open-state: 5s
        register-health-indicator: true

      cbCheckInDocService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        register-health-indicator: true

      cbOrderQueryService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 30
        failure-rate-threshold: 20
        wait-duration-in-open-state: 5s
        register-health-indicator: true


  timelimiter:
    instances:
      cbUserService:
        timeout-duration: 5000ms  # 2000ms → 5000ms로 증가
        cancel-running-future: true
      cbStoreService:
        timeout-duration: 8000ms
      cbOrderService:
        timeout-duration: 8000ms  # 주문 처리는 시간이 오래 걸릴 수 있음 (3000ms → 8000ms 증가)
      cbPaymentService:
        timeout-duration: 1200ms  # 결제는 조금 더 여유 권장
      cbCheckInService:
        timeout-duration: 700ms
      cbCheckInDocService:
        timeout-duration: 1200ms
      cbOrderQueryService:
        timeout-duration: 700ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    circuitbreakers:
      enabled: true
        
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    reactor.netty.http.client: DEBUG
