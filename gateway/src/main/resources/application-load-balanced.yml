# Gateway Load Balanced Profile Configuration
spring:
  profiles:
    active: load-balanced

  # 데이터소스 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:popcorn_db}?currentSchema=public
    username: ${DB_USERNAME:popcorn_user}
    password: ${DB_PASSWORD:popcorn123}
    hikari:
      maximum-pool-size: 200
      minimum-idle: 100
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 120000
      validation-timeout: 10000
      connection-test-query: SELECT 1

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 30000ms
      connect-timeout: 10000ms
      jedis:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 25

  # Cloud Gateway 설정
  cloud:
    gateway:
      httpclient:
        pool:
          max-connections: 1000
          max-idle-time: 30s
        connect-timeout: 10000
        response-timeout: 60000
      routes:
        # Stores 서비스 라우팅
        - id: stores-route
          uri: http://stores-1:8083
          predicates:
            - Path=/api/stores/**
          filters:
            - StripPrefix=1

        # Users 서비스 라우팅
        - id: users-route
          uri: http://user-1:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

# 서버 설정
server:
  port: 8080
  compression:
    enabled: true

# 액추에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized

# 로깅 설정
logging:
  level:
    com.popcorn: INFO
    org.springframework.cloud.gateway: DEBUG