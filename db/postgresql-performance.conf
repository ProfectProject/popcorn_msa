# PostgreSQL 고성능 설정 (500 RPS 대응)
# /var/lib/postgresql/data/postgresql.conf에 추가

# 연결 설정
max_connections = 500
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 32MB
maintenance_work_mem = 128MB

# 체크포인트 최적화
checkpoint_completion_target = 0.9
wal_buffers = 32MB
max_wal_size = 2GB
min_wal_size = 512MB

# 로깅 최적화 (성능 우선)
log_statement = 'none'
log_min_duration_statement = 5000

# 쿼리 최적화
random_page_cost = 1.5
effective_io_concurrency = 100