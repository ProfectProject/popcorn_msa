x-db-defaults: &db-defaults
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5430}

services:
  db:
    image: postgres:15-alpine
    container_name: popcorn-db
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: ${DB_NAME:-popcorn_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-popcorn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: popcorn-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  kafka-1:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-1
    ports:
      - "9092:9092"
      - "19101:9101"
    environment:
      # KRaft 모드 설정 (3 브로커)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 리스너 설정
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # 복제/ISR 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 토픽 자동 생성 설정
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      # 로그 설정
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      # JMX 모니터링
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-1

      # 클러스터 ID (동일해야 함)
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-2:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-2
    ports:
      - "9093:9092"
      - "19102:9101"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-2
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-3:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-3
    ports:
      - "9094:9092"
      - "19103:9101"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: popcorn-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101

      # UI 기능 활성화
      DYNAMIC_CONFIG_ENABLED: 'true'

      # Security 설정 (개발환경용 - 비활성화)
      KAFKA_CLUSTERS_0_READONLY: 'false'

      # Schema Registry 설정 (필요시)
      # KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

      # Kafka Connect 설정
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

      # KSQL DB 설정 (필요시)
      # KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb:8088

      # JMX 메트릭 설정
      KAFKA_CLUSTERS_0_JMX_PORT: 9101
      KAFKA_CLUSTERS_0_JMX_SSL: 'false'

      # UI 설정
      MANAGEMENT_HEALTH_LDAP_ENABLED: 'false'
      SPRING_SECURITY_ENABLED: 'false'
    restart: unless-stopped

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8089:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: popcorn-connect-group
      CONFIG_STORAGE_TOPIC: popcorn-connect-configs
      OFFSET_STORAGE_TOPIC: popcorn-connect-offsets
      STATUS_STORAGE_TOPIC: popcorn-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: kafka-connect
      REST_PORT: 8083
      LOG_LEVEL: INFO
      KAFKA_LOG4J_LOGGERS: "io.debezium.connector.postgresql=DEBUG,io.debezium.transforms.outbox=DEBUG,org.apache.kafka.connect.runtime.Worker=INFO"
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    image: popcorn/gateway:local
    container_name: popcorn-gateway
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    restart: always

  user:
    build:
      context: ./users
    image: popcorn/users:local
    container_name: popcorn-user
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8082:8082"
    restart: always

  stores:
    build:
      context: ./stores
    image: popcorn/stores:local
    container_name: popcorn-stores
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  checkIns:
    build:
      context: ./checkIns
    image: popcorn/checkins:local
    container_name: popcorn-checkins
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  order:
    build:
      context: ./order
    image: popcorn/order:local
    container_name: popcorn-order
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      STORE_SERVICE_BASE_URL: http://popcorn-gateway:8080
      USERS_SERVICE_BASE_URL: http://popcorn-gateway:8080
      ORDERQUERY_SERVICE_BASE_URL: http://popcorn-gateway:8080
      STORE_SERVICE_URL: http://popcorn-gateway:8080
      USERS_SERVICE_URL: http://popcorn-gateway:8080
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: always

  orderquery:
    build:
      context: ./orderQuery
    image: popcorn/orderquery:local
    container_name: popcorn-orderquery
    ports:
      - "8087:8087"
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      DB_NAME: ${DB_NAME:-popcorn_db}
      ORDER_QUERY_DB_USERNAME: ${ORDER_QUERY_DB_USERNAME:-order_query_app}
      ORDER_QUERY_DB_PASSWORD: ${ORDER_QUERY_DB_PASSWORD:-quary123}
      ORDER_QUERY_FLYWAY_USERNAME: ${ORDER_QUERY_FLYWAY_USERNAME:-order_query_migrator}
      ORDER_QUERY_FLYWAY_PASSWORD: ${ORDER_QUERY_FLYWAY_PASSWORD:-quary321}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      STORE_SERVICE_BASE_URL: http://popcorn-gateway:8080
      USERS_SERVICE_BASE_URL: http://popcorn-gateway:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: always

  payment:
    build:
      context: ./payment
    image: popcorn/payment:local
    container_name: popcorn-payment
    ports:
      - "8085:8085"
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_PROFILES_ACTIVE: local
      ORDER_SERVICE_BASE_URL: http://popcorn-gateway:8080
      USER_SERVICE_BASE_URL: http://popcorn-gateway:8080
      GATEWAY_URL: http://popcorn-gateway:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: always

  coupon:
    build:
      context: ./coupon
    image: popcorn/coupon:local
    container_name: popcorn-coupon
    env_file:
      - ./.env
    environment:
      <<: *db-defaults
      REDIS_HOST: redis
      SPRING_REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_PROFILES_ACTIVE: local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      ORDER_SERVICE_BASE_URL: http://popcorn-gateway:8080
      USER_SERVICE_BASE_URL: http://popcorn-gateway:8080
      PAYMENT_SERVICE_BASE_URL: http://popcorn-gateway:8080
      GATEWAY_URL: http://popcorn-gateway:8080
      KAFKA_ENABLED: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always


volumes:
  db_data:
  redis-data:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
