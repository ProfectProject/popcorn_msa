plugins {
	id 'java-library'
	id 'maven-publish'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.9' apply false
	id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

// Java 호환성 설정
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
	withJavadocJar()
}

description = 'Common-Lib - AOP, Cache, Filter, DTO 등 공통 기능'

// Spring Boot dependency management 적용
dependencyManagement {
	imports {
		mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
	}
}

// 라이브러리 의존성
dependencies {
	// Spring Boot Starters를 implementation으로 변경하여 런타임에 포함
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Kafka 의존성
	implementation 'org.springframework.kafka:spring-kafka'

	// 필수 라이브러리 의존성 (api로 노출)
	api 'org.springframework:spring-context'
	api 'org.springframework:spring-web'
	api 'org.springframework:spring-webmvc'
	api 'org.springframework:spring-jdbc'
	api 'org.springframework:spring-tx'
	api 'org.springframework:spring-aop'

	// Cache 관련 필수 의존성
	api 'com.github.ben-manes.caffeine:caffeine'
	api 'org.springframework:spring-context-support'

	// Validation 관련
	api 'jakarta.validation:jakarta.validation-api'
	api 'org.hibernate.validator:hibernate-validator'

	// JSON 처리
	api 'com.fasterxml.jackson.core:jackson-core'
	api 'com.fasterxml.jackson.core:jackson-databind'

	// Servlet API
	implementation 'jakarta.servlet:jakarta.servlet-api'

	// Lombok (필수) - implementation으로 변경
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	//kafka
	implementation 'org.springframework.kafka:spring-kafka' 

	// Flyway (선택적 의존성)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'


	// 테스트 의존성
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework:spring-test'
	testRuntimeOnly 'com.h2database:h2'
}

// 테스트/로컬 실행에서 클래스 디렉토리를 직접 사용 (JAR 스캔 오류 회피)
configurations {
	classesElements {
		canBeConsumed = true
		canBeResolved = false
		attributes {
			attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
			attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
			attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
		}
	}
}

artifacts {
	sourceSets.main.output.classesDirs.each { classesDir ->
		classesElements(classesDir)
	}
	if (sourceSets.main.output.resourcesDir != null) {
		classesElements(sourceSets.main.output.resourcesDir)
	}
}

// 라이브러리 JAR 생성 설정
jar {
	enabled = true
	archiveClassifier = '' // 기본 JAR 생성
	manifest {
		attributes(
			'Implementation-Title': 'PopCorn Common Library',
			'Implementation-Version': project.version,
			'Implementation-Vendor': 'PopCorn Team',
			'Created-By': 'Gradle ' + gradle.gradleVersion,
			'Build-Jdk': System.getProperty('java.version')
		)
	}
}

// Javadoc JAR 생성 (에러 무시)
tasks.named('javadoc') {
	options.addStringOption('Xdoclint:none', '-quiet')
	failOnError = false
}

// 아티팩트는 withSourcesJar()와 withJavadocJar()로 자동 생성됨

// Maven 발행 설정 (향후 내부 Maven 저장소 배포용)
publishing {
	publications {
		maven(MavenPublication) {
			from components.java

			pom {
				name = 'PopCorn Common Library'
				description = 'Common utilities and components for PopCorn application'
				url = 'https://github.com/popcorn-team/popcorn-common'

				licenses {
					license {
						name = 'MIT License'
						url = 'https://opensource.org/licenses/MIT'
					}
				}

				developers {
					developer {
						id = 'popcorn-team'
						name = 'PopCorn Development Team'
						email = 'dev@popcorn.com'
					}
				}
			}
		}
	}
}

// Jacoco 코드 커버리지 설정
jacoco {
	toolVersion = "0.8.13"
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// 코드 커버리지 검증 (라이브러리는 80% 목표)
jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80 // 80% 커버리지 요구
			}
		}
	}
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

// IntelliJ Kotlin DSL sync compatibility for Java-only module
tasks.register('prepareKotlinBuildScriptModel') {
	group = 'help'
	description = 'No-op task for IDE sync compatibility.'
}

// 라이브러리 빌드 정보 출력
tasks.register('libraryInfo') {
	description = 'Common 라이브러리 정보 출력'
	group = 'help'
	doLast {
		println """
📚 Common-Lib v${version}

🎯 제공 기능:
   • AOP (Rate Limit, Retry, Cache, Audit 등)
   • Cache (Caffeine 기반 멱등성 처리)
   • Filter (요청 로깅, 성능 측정)
   • DTO (공통 응답, 에러 처리)
   • Config (데이터소스, 트랜잭션 등)
   • Exception (기본 예외 처리)
   • Versioning (API 버전 관리)
   • Util (블로킹 실행기 등)

📦 생성된 아티팩트:
   • common-lib-${version}.jar
   • common-lib-${version}-sources.jar
   • common-lib-${version}-javadoc.jar

🚀 사용 방법:
   dependencies {
       implementation project(':common-lib')
       // 또는 Maven 저장소에서
       // implementation 'com.popcorn:common-lib:${version}'
   }
		"""
	}
}
