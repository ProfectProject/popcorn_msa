server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful  # 프로덕션에서는 graceful shutdown
  tomcat:
    uri-encoding: UTF-8

spring:
  config:
    activate:
      on-profile: prod

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # 데이터베이스 설정 (프로덕션 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # 프로덕션 커넥션 풀 최적화
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
      validation-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1200000

  # JPA 설정 (프로덕션)
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 반드시 validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        format_sql: false
        show_sql: false
        default_schema: payment
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

  cache:
    type: simple
    cache-names: hybridPrices,sessionPrices,goodsPrices
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  # Redis 설정 (프로덕션)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 5000ms
      database: 2  # Payment 서비스 전용 DB
      # 프로덕션 레디스 풀 설정
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000ms
        shutdown-timeout: 100ms

  # Flyway 설정 (프로덕션)
  flyway:
    enabled: true
    user: ${PAYMENT_DB_MIGRATION_USERNAME:${PAYMENT_FLYWAY_USERNAME:${PAYMENT_DB_USERNAME}}}
    password: ${PAYMENT_DB_MIGRATION_PASSWORD:${PAYMENT_FLYWAY_PASSWORD:${PAYMENT_DB_PASSWORD}}}
    default-schema: payment
    schemas: payment
    locations: classpath:db/migration
    baseline-on-migrate: false  # 프로덕션에서는 baseline 비활성화
    validate-on-migrate: true
    out-of-order: false         # 프로덕션에서는 순서 엄격히 적용

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 설정 (프로덕션)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  consumer:
    group-id: payment-service-group
    concurrency: 6
    max-poll-records: 500
    session-timeout-ms: 30000
    heartbeat-interval-ms: 10000
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    acks: all
    retries: 2147483647
    enable-idempotence: true
    max-in-flight-requests-per-connection: 5
    compression-type: snappy
    batch-size: 16384
    linger-ms: 5
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000

springdoc:
  api-docs:
    enabled: false  # 프로덕션에서는 비활성화
    path: /v3/api-docs
  swagger-ui:
    enabled: false  # 프로덕션에서는 비활성화
    path: /swagger-ui.html

# 로깅 설정 (프로덕션 - 최적화)
logging:
  level:
    root: WARN
    com.popcorn.payment: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/payment-service/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# 외부 서비스 설정 (프로덕션)
external:
  services:
    users:
      base-url: ${USERS_SERVICE_BASE_URL}
    stores:
      base-url: ${STORES_SERVICE_BASE_URL}

  # 외부 서비스 데이터베이스 직접 연결 (프로덕션)
  database:
    users:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${USER_AUTH_DB_USERNAME}
      password: ${USER_AUTH_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5    # 읽기 전용이므로 작은 풀 사용
        minimum-idle: 2
        connection-timeout: 3000ms
        read-only: true         # 읽기 전용 연결
    stores:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${STORE_DB_USERNAME}
      password: ${STORE_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5    # 읽기 전용이므로 작은 풀 사용
        minimum-idle: 2
        connection-timeout: 3000ms
        read-only: true         # 읽기 전용 연결

# 프로덕션 Payment 서비스 비즈니스 설정
payment:
  webhook:
    timeout: ${PAYMENT_WEBHOOK_TIMEOUT:15000}  # 프로덕션에서는 15초
  validation:
    max-amount: ${PAYMENT_MAX_AMOUNT:1000000}  # 프로덕션 최대 결제 금액
  notification:
    enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}
    retry-count: ${PAYMENT_NOTIFICATION_RETRY:5}  # 프로덕션에서는 더 많은 재시도
    timeout: 5000  # 알림 타임아웃 5초
  # Toss Payments 설정
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE:false}

# 프로덕션 보안 설정
security:
  require-ssl: true

# 프로덕션 액추에이터 설정 (보안 강화)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never  # 프로덕션에서는 상세 정보 숨김
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s
    distribution:
      percentiles-histogram:
        payment.kafka.processing.duration: true
        payment.transaction.duration: true
        payment.toss.api.duration: true
        payment.validation.duration: true
      percentiles:
        payment.kafka.processing.duration: 0.5, 0.95, 0.99
        payment.transaction.duration: 0.5, 0.95, 0.99
        payment.toss.api.duration: 0.5, 0.95, 0.99
        payment.validation.duration: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 0.1  # 프로덕션에서는 10% 샘플링