server:
  port: 8085
  shutdown: graceful  # 프로덕션에서는 graceful shutdown

spring:
  config:
    activate:
      on-profile: prod

  # 데이터베이스 설정 (프로덕션 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    # 프로덕션 커넥션 풀 최적화
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA 설정 (프로덕션)
  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 반드시 validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
    show-sql: false

  # Flyway 설정 (프로덕션)
  flyway:
    enabled: true
    locations: classpath:db/migration/payment
    baseline-on-migrate: false  # 프로덕션에서는 baseline 비활성화
    validate-on-migrate: true
    out-of-order: false         # 프로덕션에서는 순서 엄격히 적용
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${PAYMENT_DB_MIGRATION_USERNAME:${PAYMENT_FLYWAY_USERNAME:${PAYMENT_DB_USERNAME}}}
    password: ${PAYMENT_DB_MIGRATION_PASSWORD:${PAYMENT_FLYWAY_PASSWORD:${PAYMENT_DB_PASSWORD}}}

# 외부 서비스 URL 설정 (Order service에서 이전)
external:
  services:
    users:
      base-url: ${USERS_SERVICE_BASE_URL}
    stores:
      base-url: ${STORES_SERVICE_BASE_URL}

  # Redis 설정 (프로덕션)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 2  # Payment 서비스 전용 DB
      timeout: 5000ms
      # 프로덕션 레디스 풀 설정
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000ms
        shutdown-timeout: 100ms

# 로깅 설정 (프로덕션 - 최적화)
logging:
  level:
    root: WARN
    com.popcorn.payment: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/payment-service/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# Toss Payments 설정 (프로덕션)
toss:
  payments:
    base-url: ${TOSS_PAYMENTS_BASE_URL}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE:false}  # 프로덕션에서는 실제 결제

# 이벤트 기반 아키텍처 - HTTP 통신 제거 (프로덕션)
# microservices 통신은 Redis Stream 이벤트로 대체

# 프로덕션 Payment 서비스 비즈니스 설정
payment:
  webhook:
    timeout: ${PAYMENT_WEBHOOK_TIMEOUT:15000}  # 프로덕션에서는 15초
  validation:
    max-amount: ${PAYMENT_MAX_AMOUNT:1000000}  # 프로덕션 최대 금액
  notification:
    enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}
    retry-count: ${PAYMENT_NOTIFICATION_RETRY:5}  # 프로덕션에서는 더 많은 재시도
    timeout: 5000  # 알림 타임아웃 5초

# 프로덕션 보안 설정
security:
  require-ssl: true

# 프로덕션 액추에이터 설정 (보안 강화)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never  # 프로덕션에서는 상세 정보 숨김
  metrics:
    export:
      prometheus:
        enabled: true
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
