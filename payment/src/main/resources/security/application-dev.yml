server:
  port: 8080
  shutdown: immediate

spring:
  config:
    activate:
      on-profile: dev

  # 데이터베이스 설정 (개발 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    driver-class-name: org.postgresql.Driver
    username: ${PAYMENT_DB_USERNAME:payment_app}
    password: ${PAYMENT_DB_PASSWORD:payment123}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000

  # JPA 설정 (개발 환경)
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment
    show-sql: true

  # Flyway 설정 (개발 환경)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    user: ${PAYMENT_DB_MIGRATION_USERNAME:${PAYMENT_FLYWAY_USERNAME:${PAYMENT_DB_USERNAME:payment_app}}}
    password: ${PAYMENT_DB_MIGRATION_PASSWORD:${PAYMENT_FLYWAY_PASSWORD:${PAYMENT_DB_PASSWORD:payment123}}}
    schemas: payment
    default-schema: payment

  # Redis 설정 (개발 환경)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2  # Payment 서비스 전용 DB
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 2

# 로깅 설정 (개발 환경용)
logging:
  level:
    com.popcorn.payment: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Toss Payments 설정 (개발용)
toss:
  payments:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE:true}  # 개발에서는 테스트 모드

# 이벤트 기반 아키텍처 - HTTP 통신 제거
# microservices 통신은 Redis Stream 이벤트로 대체

springdoc:
  server-url: ${GATEWAY_SERVICE_URL:https://dev.goormpopcorn.shop}

# 헬스체크 (개발 환경)
management:
  health:
    redis:
      enabled: false

# Payment 서비스 비즈니스 설정 (개발용)
payment:
  webhook:
    timeout: ${PAYMENT_WEBHOOK_TIMEOUT:30000}
  validation:
    max-amount: ${PAYMENT_MAX_AMOUNT:500000}
  notification:
    enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}
    retry-count: ${PAYMENT_NOTIFICATION_RETRY:3}
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
