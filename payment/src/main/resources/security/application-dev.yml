server:
  port: ${SERVER_PORT:8085}
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8

spring:
  config:
    activate:
      on-profile: dev

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

  # 데이터베이스 설정 (개발 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${PAYMENT_DB_USERNAME:payment_app}
    password: ${PAYMENT_DB_PASSWORD:payment123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 600000

  # JPA 설정 (개발 환경)
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        format_sql: true
        show_sql: true
        default_schema: payment
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  cache:
    type: simple
    cache-names: hybridPrices,sessionPrices,goodsPrices
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  # Redis 설정 (개발 환경)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      database: 2  # Payment 서비스 전용 DB
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 2

  # Flyway 설정 (개발 환경)
  flyway:
    enabled: true
    user: ${PAYMENT_DB_MIGRATION_USERNAME:${PAYMENT_FLYWAY_USERNAME:${PAYMENT_DB_USERNAME}}}
    password: ${PAYMENT_DB_MIGRATION_PASSWORD:${PAYMENT_FLYWAY_PASSWORD:${PAYMENT_DB_PASSWORD}}}
    default-schema: payment
    schemas: payment
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:my-super-secret-key-for-popcorn-msa-development-only-do-not-use-in-production}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 설정 (개발 환경)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
  consumer:
    group-id: payment-service-group
    concurrency: 6
    max-poll-records: 500
    session-timeout-ms: 30000
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    acks: all
    retries: 2147483647
    compression-type: snappy
    enable-idempotence: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  server-url: ${GATEWAY_SERVICE_URL:https://dev.goormpopcorn.shop}

# 로깅 설정 (개발 환경용)
logging:
  level:
    com.popcorn.payment: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 외부 서비스 설정 (개발 환경)
external:
  services:
    users:
      base-url: ${USERS_SERVICE_BASE_URL:http://localhost:8082}
    stores:
      base-url: ${STORES_SERVICE_BASE_URL:http://localhost:8083}

  # 외부 서비스 데이터베이스 직접 연결 (개발 환경)
  database:
    users:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
      username: ${USER_AUTH_DB_USERNAME:user_auth_app}
      password: ${USER_AUTH_DB_PASSWORD:user_auth123}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3    # 개발환경용 작은 풀
        minimum-idle: 1
        connection-timeout: 3000ms
        read-only: true
    stores:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
      username: ${STORE_DB_USERNAME:store_app}
      password: ${STORE_DB_PASSWORD:store123}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3    # 개발환경용 작은 풀
        minimum-idle: 1
        connection-timeout: 3000ms
        read-only: true

# Payment 서비스 비즈니스 설정 (개발용)
payment:
  webhook:
    timeout: ${PAYMENT_WEBHOOK_TIMEOUT:30000}
  validation:
    max-amount: ${PAYMENT_MAX_AMOUNT:500000}
  notification:
    enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}
    retry-count: ${PAYMENT_NOTIFICATION_RETRY:3}
  # Toss Payments 설정
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE:true}

# 모니터링 및 메트릭 설정 (개발 환경)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always  # 개발 환경에서는 상세 정보 표시
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 5s  # 개발환경에서는 더 자주 수집
    distribution:
      percentiles-histogram:
        payment.kafka.processing.duration: true
        payment.transaction.duration: true
        payment.toss.api.duration: true
      percentiles:
        payment.kafka.processing.duration: 0.5, 0.95, 0.99
        payment.transaction.duration: 0.5, 0.95, 0.99
        payment.toss.api.duration: 0.5, 0.95, 0.99
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0  # 개발환경에서는 100% 샘플링
