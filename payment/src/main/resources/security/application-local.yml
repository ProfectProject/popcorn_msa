server:
  port: ${SERVER_PORT:8085}
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8

spring:
  config:
    activate:
      on-profile: local

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${PAYMENT_DB_USERNAME:payment_app}
    password: ${PAYMENT_DB_PASSWORD:payment123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10  # 최적화: 20 → 10
      minimum-idle: 3        # 최적화: 5 → 3
      connection-timeout: 5000  # 최적화: 20초 → 5초
      validation-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        format_sql: false
        show_sql: false
        default_schema: payment
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  cache:
    type: simple
    cache-names: hybridPrices,sessionPrices,goodsPrices
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1000ms  # 최적화: 2초 → 1초
      database: 2  # Payment 서비스 전용 DB
      connection-timeout: 1000ms  # 최적화: 2초 → 1초
      lettuce:
        pool:
          max-active: 10  # 최적화: 20 → 10
          max-idle: 8     # 최적화: 16 → 8
          min-idle: 3     # 최적화: 8 → 3
          max-wait: 1000ms  # 최적화: 2초 → 1초

  flyway:
    enabled: true
    user: ${PAYMENT_FLYWAY_USERNAME:payment_migrator}
    password: ${PAYMENT_FLYWAY_PASSWORD:payment321}
    default-schema: payment
    schemas: payment
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false


# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:my-super-secret-key-for-popcorn-msa-development-only-do-not-use-in-production}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 설정 (프로덕션 준비)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

  # Consumer 설정
  consumer:
    group-id: payment-service-group
    concurrency: 6
    max-poll-records: 500
    session-timeout-ms: 30000
    heartbeat-interval-ms: 10000
    auto-offset-reset: earliest
    enable-auto-commit: false

  # Producer 설정
  producer:
    acks: all
    retries: 2147483647
    enable-idempotence: true
    max-in-flight-requests-per-connection: 5
    compression-type: snappy
    batch-size: 16384
    linger-ms: 5
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000

  # DLQ 및 재시도 설정
  retry:
    max-attempts: 3
    initial-delay-ms: 1000
    max-delay-ms: 300000  # 5분
    multiplier: 2.0

  # 토픽 설정
  topics:
    payment-events:
      partitions: 6
      replicas: 1
      retention-ms: 86400000  # 1일
    payment-requests:
      partitions: 6
      replicas: 1
      retention-ms: 86400000
    payment-events-dlq:
      partitions: 6
      replicas: 1
      retention-ms: 2592000000  # 30일
    payment-requests-dlq:
      partitions: 6
      replicas: 1
      retention-ms: 2592000000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 모니터링 및 메트릭 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s
    distribution:
      percentiles-histogram:
        payment.kafka.processing.duration: true
      percentiles:
        payment.kafka.processing.duration: 0.5, 0.95, 0.99
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: false

logging:
  level:
    root: WARN
    com.popcorn.payment: INFO
    org.springframework.web: WARN
    org.springframework.boot.web: WARN
    org.hibernate.SQL: INFO
    org.springframework.security: WARN

# 외부 서비스/DB 설정
external:
  services:
    users:
      base-url: ${USERS_SERVICE_BASE_URL:http://localhost:8082}
    stores:
      base-url: ${STORES_SERVICE_BASE_URL:http://localhost:8083}

  # 외부 서비스 데이터베이스 직접 연결
  database:
    users:
      jdbc-url: ${EXTERNAL_DATABASE_USERS_JDBC_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:popcorn_db}}
      username: ${USER_AUTH_DB_USERNAME:user_auth_app}
      password: ${USER_AUTH_DB_PASSWORD:user_auth123}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        connection-timeout: 3000ms
        read-only: true
    stores:
      jdbc-url: ${EXTERNAL_DATABASE_STORES_JDBC_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:popcorn_db}}
      username: ${STORE_DB_USERNAME:store_app}
      password: ${STORE_DB_PASSWORD:store123}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        connection-timeout: 3000ms
        read-only: true

# Payment 서비스 설정
payment:
  webhook:
    timeout: ${PAYMENT_WEBHOOK_TIMEOUT:30000}
  validation:
    max-amount: ${PAYMENT_MAX_AMOUNT:500000}
  notification:
    enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}
    retry-count: ${PAYMENT_NOTIFICATION_RETRY:3}
  # Toss Payments 설정
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE}
