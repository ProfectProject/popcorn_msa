server:
  port: 8085
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8
spring:
  config:
    activate:
      on-profile: local
  datasource:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${PAYMENT_DB_USERNAME}
      password: ${PAYMENT_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 20000
        validation-timeout: 3000
        idle-timeout: 300000
        max-lifetime: 1200000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        format_sql: false
        show_sql: false
        default_schema: payment
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  cache:
    type: simple
    cache-names: hybridPrices,sessionPrices,goodsPrices
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m  # 5분 캐시

  # Redis 설정 (stores 서비스와 동일한 극한 성능 최적화)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms  # Redis Stream 안정성 위해 기본 타임아웃 복구
      database: ${REDIS_DATABASE:0}  # Order, Stores 서비스와 동일한 database 0 사용
      connection-timeout: 2000ms  # 연결 지연에 대비해 타임아웃 완화
      jedis:
        pool:
          max-active: 20  # 10 → 20 (더 많은 동시 연결)
          max-idle: 16   # 8 → 16 (더 많은 유휴 연결)
          min-idle: 8    # 2 → 8 (더 많은 최소 연결)
          max-wait: 2000ms # 커넥션 풀 대기 여유 확대

  flyway:
    enabled: true
    user: ${PAYMENT_FLYWAY_USERNAME}
    password: ${PAYMENT_FLYWAY_PASSWORD}
    default-schema: payment
    schemas: payment
    locations: classpath:db/migration/schema,classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    clean-disabled: false

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:my-super-secret-key-for-popcorn-msa-development-only-do-not-use-in-production}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Toss Payments 설정 (stores 서비스 방식 적용)
payment:
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:test_sk_Poxy1XQL8Rxpno1voaJZV7nO5Wml}
    client-key: ${TOSS_CLIENT_KEY:test_ck_AQ92ymxN34LKgMYlpPZy3ajRKXvd}

# 외부 서비스 및 DB 설정 (통합)
external:
  database:
    users:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${USER_AUTH_DB_USERNAME}
      password: ${USER_AUTH_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5    # 읽기 전용이므로 작은 풀 사용
        minimum-idle: 2
        connection-timeout: 3000ms
        read-only: true         # 읽기 전용 연결
    stores:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${STORE_DB_USERNAME}
      password: ${STORE_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5    # 읽기 전용이므로 작은 풀 사용
        minimum-idle: 2
        connection-timeout: 3000ms
        read-only: true         # 읽기 전용 연결

logging:
  level:
    root: WARN  # 기본 로그 레벨을 WARN으로 설정하여 성능 개선
    com.popcorn.payment: INFO  # DEBUG → INFO (20-30% 성능 향상)
    org.springframework.web: WARN  # DEBUG → WARN (웹 요청 로그 최소화)
    org.springframework.boot.web: WARN
    org.hibernate.SQL: INFO  # DEBUG → INFO (SQL 로깅 최소화로 큰 성능 향상)
    org.springframework.security: WARN
