server:
  port: 8085
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8
spring:
  config:
    activate:
      on-profile: local
  datasource:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
      username: ${PAYMENT_DB_USERNAME:payment_app}
      password: ${PAYMENT_DB_PASSWORD:payment123}
      driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  cache:
    type: simple

  # Redis 설정 (stores 서비스와 동일한 극한 성능 최적화)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms  # Redis Stream 안정성 위해 기본 타임아웃 복구
      database: 0  # Order, Stores 서비스와 동일한 database 0 사용
      connection-timeout: 2000ms  # 연결 지연에 대비해 타임아웃 완화
      jedis:
        pool:
          max-active: 20  # 10 → 20 (더 많은 동시 연결)
          max-idle: 16   # 8 → 16 (더 많은 유휴 연결)
          min-idle: 8    # 2 → 8 (더 많은 최소 연결)
          max-wait: 2000ms # 커넥션 풀 대기 여유 확대

  flyway:
    enabled: true
    user: ${PAYMENT_FLYWAY_USERNAME:payment_migrator}
    password: ${PAYMENT_FLYWAY_PASSWORD:payment321}
    default-schema: payment
    schemas: payment
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Toss Payments 설정 (stores 서비스 방식 적용)
payment:
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:test_sk_default}
    client-key: ${TOSS_CLIENT_KEY:test_ck_default}

logging:
  level:
    com.popcorn.payment: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
