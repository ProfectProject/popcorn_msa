# 🤖 Agent Configuration (Payment Service)
agent:
  health-check:
    enabled: true
    interval: 30s
    auto-healing: true
    critical-services: order-service,user-service,store-service,checkins-service

  api-test:
    enabled: true
    interval: 60s
    auto-fix: true
    concurrent-requests: 10
    target-endpoints: /api/v1/payments/health,/api/v1/payments/status,/actuator/health

  log-analysis:
    enabled: true
    interval: 120s
    auto-fix: true
    error-threshold: 10
    noise-threshold: 100

server:
  port: ${SERVER_PORT:8085}
  shutdown: immediate
  # 🚨 Emergency Tomcat 극한 최적화 - 5xx 에러 해결
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000                    # 🚨 Emergency: 대폭 증가
      min-spare: 200              # 🚨 최소 스레드 대폭 증가
    connection-timeout: 60000      # 🚨 60초 타임아웃
    keep-alive-timeout: 60000      # 🚨 Keep-Alive 연장
    max-connections: 50000         # 🚨 최대 연결 수 대폭 증가
    accept-count: 2000            # 🚨 대기 연결 수 대폭 증가

# 🌐 Gateway 설정
gateway:
  base-url: ${GATEWAY_URL:http://popcorn-gateway:8080}

# 프론트엔드 기본 URL 설정
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

spring:
  config:
    activate:
      on-profile: local

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${PAYMENT_USERNAME:payment_app}
    password: ${PAYMENT_PASSWORD:payment123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 500         # 🚨 Emergency: 10 → 500 (5xx 에러 해결)
      minimum-idle: 200              # 🚨 Emergency: 3 → 200
      connection-timeout: 10000      # 🚨 Emergency: 5초 → 10초
      validation-timeout: 5000       # 🚨 Emergency: 3초 → 5초
      idle-timeout: 300000           # 5분 유휴 타임아웃
      max-lifetime: 900000           # 🚨 Emergency: 20분 → 15분
      leak-detection-threshold: 30000 # 🚨 Emergency: 누수 감지 30초
      connection-test-query: SELECT 1 # 연결 테스트 쿼리
      keepalive-time: 30000          # 🚨 Emergency: Keep alive 30초

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        format_sql: false
        show_sql: false
        default_schema: payment
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  cache:
    type: simple
    cache-names: hybridPrices,sessionPrices,goodsPrices
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1000ms  # 최적화: 2초 → 1초
      database: 0  # Order, Stores 서비스와 동일한 database 0 사용
      connection-timeout: 1000ms  # 최적화: 2초 → 1초
      lettuce:
        pool:
          max-active: 1000          # 🚨 Emergency: 10 → 1000 (5xx 에러 해결)
          max-idle: 500             # 🚨 Emergency: 8 → 500
          min-idle: 200             # 🚨 Emergency: 3 → 200
          max-wait: 30000ms         # 🚨 Emergency: 1초 → 30초
          time-between-eviction-runs: 60000ms # 유휴 연결 정리 주기
          min-evictable-idle-time: 300000ms # 최소 유휴 시간

  flyway:
    enabled: true
    user: ${PAYMENT_FLYWAY_USERNAME:payment_migrator}
    password: ${PAYMENT_FLYWAY_PASSWORD:payment321}
    default-schema: payment
    schemas: payment
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    placeholders:
      PAYMENT_MIGRATOR_PASSWORD: ${PAYMENT_MIGRATOR_PASSWORD:payment321}


# 인증 설정 - 게이트웨이와 동일한 키 사용
passport:
  secret: ${PASSPORT_SECRET:my-super-secret-key-for-popcorn-msa-development-only-do-not-use-in-production}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 설정 (프로덕션 준비)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

  # Consumer 설정
  consumer:
    group-id: payment-service-group
    concurrency: 6
    max-poll-records: 500
    session-timeout-ms: 30000
    heartbeat-interval-ms: 10000
    auto-offset-reset: earliest
    enable-auto-commit: false

  # Producer 설정
  producer:
    acks: all
    retries: 2147483647
    enable-idempotence: true
    max-in-flight-requests-per-connection: 5
    compression-type: snappy
    batch-size: 16384
    linger-ms: 5
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000

  # DLQ 및 재시도 설정
  retry:
    max-attempts: 3
    initial-delay-ms: 1000
    max-delay-ms: 300000  # 5분
    multiplier: 2.0

  # 토픽 설정
  topics:
    payment-events:
      partitions: 6
      replicas: 1
      retention-ms: 86400000  # 1일
    payment-requests:
      partitions: 6
      replicas: 1
      retention-ms: 86400000
    payment-events-dlq:
      partitions: 6
      replicas: 1
      retention-ms: 2592000000  # 30일
    payment-requests-dlq:
      partitions: 6
      replicas: 1
      retention-ms: 2592000000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 모니터링 및 메트릭 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s
    distribution:
      percentiles-histogram:
        payment.kafka.processing.duration: true
      percentiles:
        payment.kafka.processing.duration: 0.5, 0.95, 0.99
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: false

logging:
  level:
    root: WARN
    com.popcorn.payment: INFO
    org.springframework.web: WARN
    org.springframework.boot.web: WARN
    org.hibernate.SQL: INFO
    org.springframework.security: WARN

# HTTP 클라이언트 설정 - 게이트웨이를 통한 서비스 간 통신 (MSA 원칙 준수)
order:
  service:
    base-url: ${ORDER_SERVICE_BASE_URL:http://popcorn-gateway:8080}

user:
  service:
    base-url: ${USER_SERVICE_BASE_URL:http://popcorn-gateway:8080}

# Payment 서비스 설정
payment:
  webhook:
    timeout: ${PAYMENT_WEBHOOK_TIMEOUT:30000}
  validation:
    max-amount: ${PAYMENT_MAX_AMOUNT:500000}
  notification:
    enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}
    retry-count: ${PAYMENT_NOTIFICATION_RETRY:3}
  # 주문 조회 설정 - 타임아웃 최적화
  order-query:
    timeout-ms: ${PAYMENT_ORDER_QUERY_TIMEOUT:5000}  # 5초로 단축 (기존 15초)
  # Toss Payments 설정
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE}
