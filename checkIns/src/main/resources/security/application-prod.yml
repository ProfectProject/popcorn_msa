server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful  # 프로덕션에서는 graceful shutdown

spring:
  config:
    activate:
      on-profile: prod

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # 데이터베이스 설정 (프로덕션 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${QR_DB_USERNAME}
    password: ${QR_DB_PASSWORD}
    # 프로덕션 커넥션 풀 최적화
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA 설정 (프로덕션)
  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 반드시 validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
    show-sql: false

  # Flyway 설정 (프로덕션)
  flyway:
    enabled: true
    locations: classpath:db/migration/schema
    baseline-on-migrate: false  # 프로덕션에서는 baseline 비활성화
    validate-on-migrate: true
    out-of-order: false         # 프로덕션에서는 순서 엄격히 적용
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${QR_DB_MIGRATION_USERNAME:${QR_FLYWAY_USERNAME:${QR_DB_USERNAME}}}
    password: ${QR_DB_MIGRATION_PASSWORD:${QR_FLYWAY_PASSWORD:${QR_DB_PASSWORD}}}


  # Redis 설정 (프로덕션)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 1  # CheckIns 서비스 전용 DB
      timeout: 10000ms
      connection-timeout: 5000ms
      # 프로덕션 레디스 풀 설정
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000ms
        shutdown-timeout: 100ms

# 로깅 설정 (프로덕션 - 최적화)
logging:
  level:
    root: WARN
    com.popcorn.checkIns: INFO
    com.popcorn.common: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/checkIns-service/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# 프로덕션 CheckIns 서비스 비즈니스 설정
checkIns:
  qr:
    timeout: ${QR_TIMEOUT:15000}  # 프로덕션에서는 15초
  validation:
    max-entries: ${MAX_ENTRIES:10000}  # 프로덕션 최대 입장 수
  notification:
    enabled: ${QR_NOTIFICATION_ENABLED:true}
    retry-count: ${QR_NOTIFICATION_RETRY:5}  # 프로덕션에서는 더 많은 재시도
    timeout: 5000  # 알림 타임아웃 5초

# 프로덕션 보안 설정
security:
  require-ssl: true

# 프로덕션 액추에이터 설정 (보안 강화)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never  # 프로덕션에서는 상세 정보 숨김
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s
    distribution:
      percentiles-histogram:
        checkins.kafka.processing.duration: true
        checkins.qr.generation.duration: true
        checkins.redis.operation.duration: true
      percentiles:
        checkins.kafka.processing.duration: 0.5, 0.95, 0.99
        checkins.qr.generation.duration: 0.5, 0.95, 0.99
        checkins.redis.operation.duration: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 0.1  # 프로덕션에서는 10% 샘플링

passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

# Redis 이벤트 설정 (점진적 전환 중 유지)
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 이벤트 설정 (프로덕션 환경)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  consumer:
    group-id: checkin-service-group
    concurrency: 3
    max-poll-records: 500
    session-timeout-ms: 30000
    heartbeat-interval-ms: 10000
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    acks: all
    retries: 2147483647
    enable-idempotence: true
    max-in-flight-requests-per-connection: 5
    compression-type: snappy
    batch-size: 16384
    linger-ms: 5
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000
# Kafka 이벤트 설정
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: ${CHECKINS_KAFKA_CONSUMER_GROUP_ID:checkin-service-group}
    concurrency: 3
