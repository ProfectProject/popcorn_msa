server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful  # 프로덕션에서는 graceful shutdown

  # 🚨 Emergency Tomcat 극한 최적화 - 1800 RPS 대응
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 2000                    # 🚨 Emergency: 극한 스레드 수
      min-spare: 500              # 🚨 Emergency: 최소 스레드 500개
    connection-timeout: 60000      # 🚨 Emergency: 60초 타임아웃
    keep-alive-timeout: 60000      # 🚨 Emergency: Keep-Alive 60초
    max-connections: 100000        # 🚨 Emergency: 최대 연결 수 100K
    accept-count: 5000            # 🚨 Emergency: 대기 연결 수 5K
    max-http-form-post-size: 2MB  # POST 크기 제한

spring:
  config:
    activate:
      on-profile: prod

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # 데이터베이스 설정 (프로덕션 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${QR_USERNAME}
    password: ${QR_PASSWORD}
    # 🚨 Emergency HikariCP 극한 최적화 - 1800 RPS 대응
    hikari:
      connection-init-sql: SET search_path TO qr
      maximum-pool-size: 1000        # 🚨 Emergency: 30 → 1000
      minimum-idle: 400              # 🚨 Emergency: 10 → 400
      connection-timeout: 15000      # 🚨 Emergency: 20s → 15s
      validation-timeout: 5000       # 🚨 Emergency: 검증 타임아웃 5초
      idle-timeout: 300000          # 🚨 Emergency: 5분 유지
      max-lifetime: 900000           # 🚨 Emergency: 15분으로 조정
      leak-detection-threshold: 15000 # 🚨 Emergency: 누수 감지 15초
      pool-name: "CheckInsHikariPool"
      connection-test-query: SELECT 1 # 연결 테스트 쿼리
      keepalive-time: 30000          # 🚨 Emergency: Keep alive 30초

  # JPA 설정 (프로덕션)
  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 반드시 validate
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        format_sql: false
        show_sql: false
        use_sql_comments: false        # SQL 주석 비활성화 (성능)
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: qr
        jdbc:
          batch_size: 100              # 🚨 Emergency: 50 → 100 (극한 배치)
          batch_versioned_data: true   # 버전 데이터 배치 처리
          fetch_size: 100              # 페치 크기 증가
        order_inserts: true            # INSERT 순서 최적화
        order_updates: true            # UPDATE 순서 최적화
        # 🚀 L2 캐시 활성화 (CheckIns 극한 성능)
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
    show-sql: false

  # Flyway 설정 (프로덕션)
  flyway:
    enabled: true
    locations: classpath:db/migration/schema
    baseline-on-migrate: false  # 프로덕션에서는 baseline 비활성화
    validate-on-migrate: true
    out-of-order: false         # 프로덕션에서는 순서 엄격히 적용
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${QR_FLYWAY_USERNAME}
    password: ${QR_FLYWAY_PASSWORD}


  # Redis 설정 (프로덕션)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      password: ${REDIS_PASSWORD}
      database: 1  # CheckIns 서비스 전용 DB
      timeout: 5000ms              # 🚨 Emergency: 10s → 5s (더 빠른 응답)
      connection-timeout: 5000ms    # 🚨 Emergency: 5s 연결 타임아웃
      # 🚨 Emergency Redis 극한 최적화 - 1800 RPS 대응
      lettuce:
        pool:
          max-active: 2000          # 🚨 Emergency: 50 → 2000 (극한)
          max-idle: 1000            # 🚨 Emergency: 20 → 1000 (극한)
          min-idle: 500             # 🚨 Emergency: 10 → 500 (극한)
          max-wait: 60000ms         # 🚨 Emergency: 3s → 60s (더 긴 대기)
          time-between-eviction-runs: 60000ms
          min-evictable-idle-time: 300000ms
          test-on-borrow: false     # 성능 향상
          test-on-return: false     # 성능 향상
          test-while-idle: true     # 유휴 중 검사만 활성화
        shutdown-timeout: 1000ms     # Emergency: 100ms → 1s

# 로깅 설정 (프로덕션 - 최적화)
logging:
  level:
    root: WARN
    com.popcorn.checkIns: INFO
    com.popcorn.common: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/checkIns-service/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# 프로덕션 CheckIns 서비스 비즈니스 설정
checkIns:
  qr:
    timeout: ${QR_TIMEOUT:15000}  # 프로덕션에서는 15초
  validation:
    max-entries: ${MAX_ENTRIES:10000}  # 프로덕션 최대 입장 수
  notification:
    enabled: ${QR_NOTIFICATION_ENABLED:true}
    retry-count: ${QR_NOTIFICATION_RETRY:5}  # 프로덕션에서는 더 많은 재시도
    timeout: 5000  # 알림 타임아웃 5초

# 프로덕션 보안 설정
security:
  require-ssl: true

# 프로덕션 액추에이터 설정 (보안 강화)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never  # 프로덕션에서는 상세 정보 숨김
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s
    distribution:
      percentiles-histogram:
        checkins.kafka.processing.duration: true
        checkins.qr.generation.duration: true
        checkins.redis.operation.duration: true
      percentiles:
        checkins.kafka.processing.duration: 0.5, 0.95, 0.99
        checkins.qr.generation.duration: 0.5, 0.95, 0.99
        checkins.redis.operation.duration: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 0.1  # 프로덕션에서는 10% 샘플링

passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

# Redis 이벤트 설정 (점진적 전환 중 유지)
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 이벤트 설정 (프로덕션 환경)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  consumer:
    group-id: checkin-service-group
    concurrency: 3
    max-poll-records: 500
    session-timeout-ms: 30000
    heartbeat-interval-ms: 10000
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    acks: all
    retries: 2147483647
    enable-idempotence: true
    max-in-flight-requests-per-connection: 5
    compression-type: snappy
    batch-size: 16384
    linger-ms: 5
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000
