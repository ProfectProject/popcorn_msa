server:
  port: ${SERVER_PORT:8086}
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8

spring:
  config:
    activate:
      on-profile: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      fail-fast: false
      client-id: checkins-admin
      retry-backoff-ms: 100
      retry-timeout-ms: 60000
      request-timeout-ms: 30000
      connection-timeout-ms: 10000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${QR_DB_USERNAME}
    password: ${QR_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      validation-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        format_sql: false
        show_sql: false
        default_schema: checkIns
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  cache:
    type: simple
    cache-names: qrCodes,sessions
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000ms
      database: 1  # CheckIns 서비스 전용 DB
      connection-timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 16
          min-idle: 8
          max-wait: 2000ms

  flyway:
    enabled: true
    user: ${QR_FLYWAY_USERNAME}
    password: ${QR_FLYWAY_PASSWORD}
    default-schema: checkIns
    schemas: checkIns
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    out-of-order: true
    placeholders:
      QR_MIGRATOR_PASSWORD: ${QR_FLYWAY_PASSWORD}
      QR_APP_PASSWORD: ${QR_DB_PASSWORD}

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:my-super-secret-key-for-popcorn-msa-development-only-do-not-use-in-production}
  ttl-seconds: 60

# Redis 이벤트 설정 (점진적 전환 중 유지)
redis:
  events:
    enabled: true

# Kafka 이벤트 설정 (점진적 전환용)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
  consumer:
    group-id: ${CHECKINS_KAFKA_CONSUMER_GROUP_ID:checkin-service-group}
    concurrency: 3
    max-poll-records: 500
    session-timeout-ms: 30000
    auto-offset-reset: earliest
    enable-auto-commit: false
    heartbeat-interval-ms: 3000
    fetch-min-size: 1
    fetch-max-wait-ms: 500
    connections-max-idle-ms: 540000
    request-timeout-ms: 30000
    retry-backoff-ms: 100
  producer:
    acks: all
    retries: 2147483647
    compression-type: snappy
    enable-idempotence: true
    connections-max-idle-ms: 540000
    delivery-timeout-ms: 120000
    linger-ms: 5
    max-block-ms: 60000
    request-timeout-ms: 30000
    retry-backoff-ms: 100

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 모니터링 및 메트릭 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s
    distribution:
      percentiles-histogram:
        checkins.kafka.processing.duration: true
      percentiles:
        checkins.kafka.processing.duration: 0.5, 0.95, 0.99
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: false

logging:
  level:
    root: WARN
    com.popcorn.checkIns: INFO
    com.popcorn.common: INFO
    org.springframework.web: WARN
    org.springframework.boot.web: WARN
    org.hibernate.SQL: INFO
    org.springframework.security: WARN
