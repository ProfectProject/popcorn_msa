server:
  port: ${SERVER_PORT:8080}
  shutdown: immediate

spring:
  config:
    activate:
      on-profile: dev

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # 데이터베이스 설정 (개발 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    driver-class-name: org.postgresql.Driver
    username: ${QR_USERNAME}
    password: ${QR_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000

  # JPA 설정 (개발 환경)
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: checkIns
    show-sql: true

  # Flyway 설정 (개발 환경)
  flyway:
    enabled: true
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    user: ${QR_FLYWAY_USERNAME}
    password: ${QR_FLYWAY_PASSWORD}
    schemas: checkIns
    default-schema: checkIns

  # Redis 설정 (개발 환경)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      password: ${REDIS_PASSWORD:}
      database: 1  # CheckIns 서비스 전용 DB
      timeout: 10000ms
      connection-timeout: 5000ms
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 2

# 로깅 설정 (개발 환경용)
logging:
  level:
    com.popcorn.checkIns: DEBUG
    com.popcorn.common: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


springdoc:
  server-url: ${GATEWAY_SERVICE_URL:https://dev.goormpopcorn.shop}

# 모니터링 및 메트릭 설정 (개발 환경)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always  # 개발 환경에서는 상세 정보 표시
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 5s  # 개발환경에서는 더 자주 수집
    distribution:
      percentiles-histogram:
        checkins.kafka.processing.duration: true
        checkins.qr.generation.duration: true
      percentiles:
        checkins.kafka.processing.duration: 0.5, 0.95, 0.99
        checkins.qr.generation.duration: 0.5, 0.95, 0.99
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0  # 개발환경에서는 100% 샘플링

# CheckIns 서비스 비즈니스 설정 (개발용)
checkIns:
  qr:
    timeout: ${QR_TIMEOUT:30000}
  validation:
    max-entries: ${MAX_ENTRIES:1000}
  notification:
    enabled: ${QR_NOTIFICATION_ENABLED:true}
    retry-count: ${QR_NOTIFICATION_RETRY:3}

passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

# Redis 이벤트 설정 (점진적 전환 중 유지)
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 이벤트 설정 (개발 환경 - 점진적 전환용)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
  consumer:
    group-id: checkin-service-group
    concurrency: 3
    max-poll-records: 500
    session-timeout-ms: 30000
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    acks: all
    retries: 2147483647
    compression-type: snappy
    enable-idempotence: true
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: ${CHECKINS_KAFKA_CONSUMER_GROUP_ID:checkin-service-group}
    concurrency: 3
