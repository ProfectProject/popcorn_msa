spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: checkIns
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  docker:
    compose:
      enabled: false

  passport:
    secret: ${PASSPORT_SECRET:passport-shared-secret}
    ttl-seconds: 60

  jwt:
    secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
    expiration: 3600000
    refresh-expiration-ms: 1209600000

---

spring:
  config:
    import: classpath:security/application-local.yml
    activate:
      on-profile: local
  docker:
    compose:
      enabled: false

---

spring:
  config:
    import: classpath:security/application-dev.yml
    activate:
      on-profile: dev

---

spring:
  config:
    import: classpath:security/application-prod.yml
    activate:
      on-profile: prod

app:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}

springdoc:
  api-docs:
    path: ${SWAGGER_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: alpha
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

kafka:
  enabled: ${KAFKA_ENABLED:true}
