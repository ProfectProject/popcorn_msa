# 🚀 Resilience4j 서킷 브레이커 설정 - 극한 부하 대응

resilience4j:
  # === 🔄 서킷 브레이커 설정 ===
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 60              # 실패율 60% 이상 시 차단
        slow-call-rate-threshold: 50           # 느린 호출 비율 50% 이상 시 차단
        slow-call-duration-threshold: 2s       # 2초 이상 호출을 느린 호출로 간주
        permitted-number-of-calls-in-half-open-state: 5  # 반열림 상태에서 허용할 호출 수
        minimum-number-of-calls: 20            # 최소 20번 호출 후 평가
        sliding-window-type: COUNT_BASED       # 호출 수 기반 윈도우
        sliding-window-size: 50                # 윈도우 크기 50개 호출
        wait-duration-in-open-state: 10s       # 열린 상태에서 대기 시간
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.lang.Exception
          - org.springframework.web.client.HttpServerErrorException
          - java.sql.SQLException
          - org.springframework.dao.DataAccessException
    instances:
      popup-query:                             # 팝업 조회용 서킷 브레이커
        base-config: default
        failure-rate-threshold: 70             # 팝업 조회는 더 관대하게
        wait-duration-in-open-state: 5s        # 빠른 복구
      database-query:                          # 데이터베이스 조회용
        base-config: default
        failure-rate-threshold: 50             # 더 엄격한 DB 보호
        slow-call-duration-threshold: 1s       # 1초 이상을 느린 호출로 간주

  # === ⏱️ 타임아웃 설정 ===
  timelimiter:
    configs:
      default:
        timeout-duration: 3s                   # 기본 타임아웃 3초
        cancel-running-future: true            # 실행 중인 Future 취소
    instances:
      popup-query:
        timeout-duration: 2s                   # 팝업 조회는 더 빠르게
      database-query:
        timeout-duration: 5s                   # DB 조회는 여유 있게

  # === 🔄 재시도 설정 ===
  retry:
    configs:
      default:
        max-attempts: 3                        # 최대 3번 재시도
        wait-duration: 100ms                   # 재시도 간격 100ms
        exponential-backoff-multiplier: 2      # 지수 백오프
        retry-exceptions:
          - java.sql.SQLException
          - org.springframework.dao.DataAccessException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - com.popcorn.store.domain.popup.exception.PopupException
    instances:
      popup-query:
        max-attempts: 2                        # 팝업은 빠른 실패
        wait-duration: 50ms                    # 더 빠른 재시도

  # === 📊 메트릭 설정 ===
  metrics:
    enabled: true
    use-global-registry: true

# === 🏥 Health Indicator ===
management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,metrics