server:
  port: 8083
  shutdown: immediate

  # === 🚨 Emergency 극한 부하 대응 Tomcat 최적화 ===
  tomcat:
    threads:
      max: 2000                    # 🚨 Emergency: 500→2000
      min-spare: 500              # 🚨 Emergency: 50→500
    connection-timeout: 60000      # 🚨 Emergency: 10s→60s
    keep-alive-timeout: 60000      # 🚨 Emergency: 30s→60s
    max-connections: 100000        # 🚨 Emergency: 20000→100000
    accept-count: 5000            # 🚨 Emergency: 500→5000
    max-http-form-post-size: 2MB  # POST 크기 제한
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${STORE_USERNAME}
    password: ${STORE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO store
      maximum-pool-size: ${STORE_DB_MAX_POOL_SIZE:2000}   # 🚨 EXTREME: 1000→2000 (800 RPS 대응)
      minimum-idle: ${STORE_DB_MIN_IDLE:800}              # 🚨 EXTREME: 400→800
      connection-timeout: ${STORE_DB_CONNECTION_TIMEOUT_MS:15000}   # 🚨 Emergency: 500ms→15초
      validation-timeout: ${STORE_DB_VALIDATION_TIMEOUT_MS:5000}   # 🚨 Emergency: 200ms→5초
      idle-timeout: ${STORE_DB_IDLE_TIMEOUT_MS:300000}             # 🚨 Emergency: 2분→5분
      max-lifetime: ${STORE_DB_MAX_LIFETIME_MS:900000}             # 🚨 Emergency: 5분→15분
      keepalive-time: ${STORE_DB_KEEPALIVE_TIME_MS:30000}          # 🚨 Emergency: 10초→30초
      leak-detection-threshold: 15000                     # 🚨 Emergency: 5초→15초
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          timeout: ${STORE_DB_QUERY_TIMEOUT_SEC:3}
          # 🚀 JPA 배치 및 성능 최적화 (Prod) - EXTREME
          batch_size: 200              # 🚨 EXTREME: 100→200 배치 처리 크기
          batch_versioned_data: true   # 버전 데이터 배치 처리
          fetch_size: 200              # 🚨 EXTREME: 100→200 페치 크기
        order_inserts: true            # INSERT 순서 최적화
        order_updates: true            # UPDATE 순서 최적화
        format_sql: false              # SQL 포맷팅 비활성화 (성능)
        use_sql_comments: false        # SQL 주석 비활성화 (성능)
        show_sql: false                # SQL 로깅 비활성화 (성능)
        # 🚀 L2 캐시 활성화 (Prod)
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        type:
          preferred_enum_jdbc_type: VARCHAR
        default_schema: store
      jakarta:
        persistence:
          query:
            timeout: ${STORE_DB_QUERY_TIMEOUT_MS:3000}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0  # Payment, Order 서비스와 동일한 database 0 사용
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: ${STORE_REDIS_TIMEOUT_MS:5000}ms       # 🚨 EXTREME: 2000ms → 5000ms (극한 부하 대응)
      connect-timeout: ${STORE_REDIS_CONNECT_TIMEOUT_MS:3000}ms # 🚨 EXTREME: 1000ms → 3000ms
      # 🚨 Emergency Redis 연결 풀 설정 (Prod 극한 대응)
      jedis:
        pool:
          max-active: 2000       # 🚨 Emergency: 200→2000
          max-idle: 1000         # 🚨 Emergency: 100→1000
          min-idle: 500          # 🚨 Emergency: 50→500
          max-wait: 60000ms      # 🚨 Emergency: 10초→60초
          time-between-eviction-runs: 60000ms
          min-evictable-idle-time: 300000ms
          test-on-borrow: false  # 성능 향상
          test-on-return: false  # 성능 향상
          test-while-idle: true  # 유휴 중 검사만 활성화


  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${STORE_FLYWAY_USERNAME}
    password: ${STORE_FLYWAY_PASSWORD}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    default-schema: store
    schemas: store
    clean-disabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: ${STORE_KAFKA_CONSUMER_GROUP_ID:stores-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

logging:
  level:
    # 🚀 Prod 성능 최적화: 로깅 레벨 최적화
    com.popcorn.store: INFO
    org.springframework.web: ERROR        # WARN → ERROR
    org.springframework.boot.web: ERROR   # INFO → ERROR
    org.hibernate.SQL: ERROR              # WARN → ERROR (SQL 로깅 최소화)
    org.springframework.security: ERROR   # WARN → ERROR
    com.adjh.springbootkafka: WARN        # INFO → WARN
    org:
      apache.kafka: ERROR                 # INFO → ERROR
      springframework.kafka: ERROR        # INFO → ERROR
    root: WARN                            # 전체 로깅 레벨 최적화

popcorn:
  kafka:
    topics:
      storeEvents: store-events
    topic:
      replicas: ${KAFKA_TOPIC_REPLICAS:3}
    partitions:
      storeEvents: ${STORE_EVENTS_PARTITIONS:12}
      storeRequests: ${STORE_REQUESTS_PARTITIONS:12}

store:
  cors:
    allowed-origin-patterns: https://api.goormpopcorn.shop

popup:
  detail:
    # Fail fast on Redis misses under peak, then serve cached/base data path.
    redis-lookup-timeout-ms: ${POPUP_DETAIL_REDIS_LOOKUP_TIMEOUT_MS:40}
    # Keep same-response hot key in process for burst traffic.
    hot-cache-ttl-ms: ${POPUP_DETAIL_HOT_CACHE_TTL_MS:5000}
    # Local fallback cache for transient backend spikes.
    local-cache-ttl-seconds: ${POPUP_DETAIL_LOCAL_CACHE_TTL_SECONDS:300}
  list:
    local-cache-ttl-seconds: ${POPUP_LIST_LOCAL_CACHE_TTL_SECONDS:300}
