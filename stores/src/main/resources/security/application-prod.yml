server:
  port: 8083
  shutdown: immediate

  # === 🚀 Tomcat 성능 최적화 ===
  tomcat:
    threads:
      max: 200                    # 최대 스레드 수
      min-spare: 10              # 최소 스레드 수
    connection-timeout: 20000    # 연결 타임아웃 20초
    keep-alive-timeout: 60000    # Keep-Alive 타임아웃
    max-connections: 8192        # 최대 연결 수
    accept-count: 100           # 대기 연결 수
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${STORE_USERNAME}
    password: ${STORE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO store
      maximum-pool-size: ${STORE_DB_MAX_POOL_SIZE:30}
      minimum-idle: ${STORE_DB_MIN_IDLE:10}
      connection-timeout: ${STORE_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${STORE_DB_VALIDATION_TIMEOUT_MS:1000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: VARCHAR
        default_schema: store

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: ${STORE_REDIS_TIMEOUT_MS:200}ms
      connect-timeout: ${STORE_REDIS_CONNECT_TIMEOUT_MS:200}ms


  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${STORE_FLYWAY_USERNAME}
    password: ${STORE_FLYWAY_PASSWORD}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    default-schema: store
    schemas: store
    clean-disabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: ${STORE_KAFKA_CONSUMER_GROUP_ID:stores-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

logging:
  level:
    com.popcorn.store: INFO
    org.springframework.web: WARN
    org.springframework.boot.web: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    com.adjh.springbootkafka: INFO
    org:
      apache.kafka: INFO
      springframework.kafka: INFO

popcorn:
  kafka:
    topics:
      storeEvents: store-events
    topic:
      replicas: ${KAFKA_TOPIC_REPLICAS:3}
    partitions:
      storeEvents: ${STORE_EVENTS_PARTITIONS:12}
      storeRequests: ${STORE_REQUESTS_PARTITIONS:12}

store:
  cors:
    allowed-origin-patterns: https://api.goormpopcorn.shop

popup:
  detail:
    # Fail fast on Redis misses under peak, then serve cached/base data path.
    redis-lookup-timeout-ms: ${POPUP_DETAIL_REDIS_LOOKUP_TIMEOUT_MS:40}
    # Keep same-response hot key in process for burst traffic.
    hot-cache-ttl-ms: ${POPUP_DETAIL_HOT_CACHE_TTL_MS:5000}
    # Local fallback cache for transient backend spikes.
    local-cache-ttl-seconds: ${POPUP_DETAIL_LOCAL_CACHE_TTL_SECONDS:300}
  list:
    local-cache-ttl-seconds: ${POPUP_LIST_LOCAL_CACHE_TTL_SECONDS:300}
