server:
  port: 8083
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8
spring:
  config:
    activate:
      on-profile: local
  datasource:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${STORE_DB_USERNAME}
      password: ${STORE_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        default_schema: store

  cache:
    type: simple

  # Redis 설정 (Order 서비스와 동일한 database 사용) - ⚡ 극한 성능 최적화
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms  # Redis Stream 안정성 위해 기본 타임아웃 복구
      database: 0  # Payment, Order 서비스와 동일한 database 0 사용
      connection-timeout: 1000ms  # 최적화: 2초 → 1초
      jedis:
        pool:
          max-active: 10  # 최적화: 50 → 10
          max-idle: 8    # 최적화: 30 → 8
          min-idle: 3    # 최적화: 15 → 3
          max-wait: 1000ms # 최적화: 500ms → 1000ms
          time-between-eviction-runs: 60000ms # 유휴 연결 정리 주기
          min-evictable-idle-time: 300000ms # 최소 유휴 시간
          test-on-borrow: false # 대출 시 유효성 검사 비활성화 (성능 향상)
          test-on-return: false # 반환 시 유효성 검사 비활성화 (성능 향상)
          test-while-idle: true # 유휴 중 검사만 활성화

  flyway:
    enabled: true
    user: ${STORE_FLYWAY_USERNAME}
    password: ${STORE_FLYWAY_PASSWORD}
    default-schema: store
    schemas: store
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    placeholders:
      STORE_MIGRATOR_PASSWORD: ${STORE_MIGRATOR_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092}

    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:store-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.popcorn.store: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    com.adjh.springbootkafka: DEBUG
    org:
      apache.kafka: INFO
      springframework.kafka: INFO

popcorn:
  kafka:
    topics:
      storeEvents: store-events
    topic:
      replicas: ${KAFKA_TOPIC_REPLICAS:1}
    partitions:
      storeEvents: ${STORE_EVENTS_PARTITIONS:12}

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
