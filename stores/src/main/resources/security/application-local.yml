server:
  port: 8083
  shutdown: immediate
  # 🚨 Emergency Tomcat 극한 최적화
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000                    # 🚨 Emergency: 대폭 증가
      min-spare: 200              # 🚨 최소 스레드 대폭 증가
    connection-timeout: 60000      # 🚨 60초 타임아웃
    keep-alive-timeout: 60000      # 🚨 Keep-Alive 연장
    max-connections: 50000         # 🚨 최대 연결 수 대폭 증가
    accept-count: 2000            # 🚨 대기 연결 수 대폭 증가
spring:
  config:
    activate:
      on-profile: local
  datasource:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${STORE_USERNAME}
      password: ${STORE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      # 🚨 Emergency HikariCP 극한 최적화
      hikari:
        maximum-pool-size: 500         # 🚨 Emergency: 50 → 500
        minimum-idle: 200              # 🚨 Emergency: 10 → 200
        connection-timeout: 10000      # 🚨 Emergency: 3초 → 10초
        idle-timeout: 300000           # 🚨 Emergency: 10분 → 5분
        max-lifetime: 900000           # 🚨 Emergency: 30분 → 15분
        leak-detection-threshold: 30000 # 🚨 Emergency: 60초 → 30초
        connection-test-query: SELECT 1 # 연결 테스트 쿼리
        keepalive-time: 30000          # 🚨 Emergency: Keep alive 30초
        validation-timeout: 5000       # 🚨 Emergency: 검증 타임아웃 5초
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        default_schema: store
        # 🚀 JPA 배치 및 성능 최적화
        jdbc:
          batch_size: 50              # 배치 처리 크기
          batch_versioned_data: true  # 버전 데이터 배치 처리
          fetch_size: 50              # 페치 크기
        order_inserts: true           # INSERT 순서 최적화
        order_updates: true           # UPDATE 순서 최적화
        format_sql: false             # SQL 포맷팅 비활성화 (성능)
        use_sql_comments: false       # SQL 주석 비활성화 (성능)
        show_sql: false              # SQL 로깅 비활성화 (성능)
        # 🚀 L2 캐시 활성화
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

  cache:
    type: simple

  # Redis 설정 (Order 서비스와 동일한 database 사용) - ⚡ 극한 성능 최적화
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms  # Redis Stream 안정성 위해 기본 타임아웃 복구
      database: 0  # Payment, Order 서비스와 동일한 database 0 사용
      connection-timeout: 1000ms  # 최적화: 2초 → 1초
      jedis:
        pool:
          max-active: 1000  # 🚨 Emergency: 100 → 1000
          max-idle: 500     # 🚨 Emergency: 50 → 500
          min-idle: 200     # 🚨 Emergency: 20 → 200
          max-wait: 30000ms # 🚨 Emergency: 5초 → 30초
          time-between-eviction-runs: 60000ms # 유휴 연결 정리 주기
          min-evictable-idle-time: 300000ms # 최소 유휴 시간
          test-on-borrow: false # 대출 시 유효성 검사 비활성화 (성능 향상)
          test-on-return: false # 반환 시 유효성 검사 비활성화 (성능 향상)
          test-while-idle: true # 유휴 중 검사만 활성화

  flyway:
    enabled: true
    user: ${STORE_FLYWAY_USERNAME:${STORE_USERNAME:store_app}}
    password: ${STORE_FLYWAY_PASSWORD:${STORE_PASSWORD:store123}}
    default-schema: store
    schemas: store
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    placeholders:
      STORE_MIGRATOR_PASSWORD: ${STORE_MIGRATOR_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}

    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: ${STORE_KAFKA_CONSUMER_GROUP_ID:stores-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

# Redis 이벤트 설정
redis:
  events:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    # 🚀 성능 최적화: DEBUG → INFO/WARN
    com.popcorn.store: INFO
    org.springframework.web: WARN      # DEBUG → WARN
    org.springframework.boot.web: WARN # DEBUG → WARN
    org.hibernate.SQL: WARN            # DEBUG → WARN (SQL 로깅 최소화)
    org.springframework.security: WARN # DEBUG → WARN
    com.adjh.springbootkafka: INFO     # DEBUG → INFO
    org:
      apache.kafka: WARN               # INFO → WARN
      springframework.kafka: WARN      # INFO → WARN
    root: WARN                         # 전체 로깅 레벨 최적화

popcorn:
  kafka:
    topics:
      storeEvents: store-events
    topic:
      replicas: ${KAFKA_TOPIC_REPLICAS:1}
    partitions:
      storeEvents: ${STORE_EVENTS_PARTITIONS:12}
      storeRequests: ${STORE_REQUESTS_PARTITIONS:12}

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
