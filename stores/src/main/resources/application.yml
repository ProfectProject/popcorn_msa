# Spring Boot 기본 설정
spring:
  application:
    name: stores
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  profiles:
    default: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

---
# Test 환경 설정 (H2 데이터베이스 강제 사용)
spring:
  config:
    activate:
      on-profile: test
redis:
  idempotency:
    clear-on-startup: true
  # H2 데이터베이스 설정
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=UUID;IGNORE_UNKNOWN_SETTINGS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: STRING
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

---
# Local 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-local.yml,optional:file:.env[.properties]
    activate:
      on-profile: local
redis:
  idempotency:
    clear-on-startup: true

  # Flyway 설정 (Local)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/schema
#      - classpath:db/migration/seed
    default-schema: store
    schemas: store
    create-schemas: true
    clean-disabled: false  # 개발 환경에서만 허용
---
# Development 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-dev.yml
    activate:
      on-profile: dev

  # Flyway 설정 (Dev)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/schema
#      - classpath:db/migration/seed
    default-schema: store
    schemas: store
    create-schemas: true
    clean-disabled: true  # 개발/운영 환경에서는 비활성화

---
# Production 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-prod.yml
    activate:
      on-profile: prod

  # Flyway 설정 (Prod)
  flyway:
    enabled: true
    baseline-on-migrate: false  # 운영 환경에서는 false
    locations:
      - classpath:db/migration/schema
#      - classpath:db/migration/seed
    default-schema: store
    schemas: store
    create-schemas: false  # 운영 환경에서는 false
    clean-disabled: true  # 운영 환경에서는 반드시 true
    validate-on-migrate: true  # 운영 환경에서 마이그레이션 검증

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    circuitbreakers:
      enabled: true

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    groups-order: ASC
    operations-sorter: method
    tags-sorter: order
    urls:
      - name: stores-owner
        url: /v3/api-docs/owner
      - name: stores-manager
        url: /v3/api-docs/manager

---
# 기본 테스트 프로파일 설정
spring:
  config:
    activate:
      on-profile: test

# 기본 테스트 환경 설정 (application-test.yml이 추가 설정 제공)
jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
