server:
  port: 8084
  shutdown: immediate

spring:
  config:
    activate:
      on-profile: dev

  # 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${ORDER_DB_USERNAME:order_app}
    password: ${ORDER_DB_PASSWORD:order123}
    driver-class-name: org.postgresql.Driver

  # JPA 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: orders

  # Flyway 설정
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    user: ${ORDER_FLYWAY_USERNAME:order_migrator}
    password: ${ORDER_FLYWAY_PASSWORD:order321}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration/order
    default-schema: orders
    schemas: orders

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# 로깅 설정
logging:
  level:
    com.popcorn.order: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 이벤트 기반 아키텍처 - HTTP 통신 제거
# microservices 통신은 Redis Stream 이벤트로 대체

# Order 서비스 비즈니스 설정
order:
  payment:
    timeout: ${ORDER_PAYMENT_TIMEOUT:30000}
  cancel:
    timeout: ${ORDER_CANCEL_TIMEOUT:1800}
  validation:
    max-quantity: ${ORDER_MAX_QUANTITY:100}

passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000
