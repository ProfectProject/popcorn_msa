server:
  port: 8084
  shutdown: immediate
  # 🚨 Emergency Tomcat 극한 최적화 - 5xx 에러 해결
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000                    # 🚨 Emergency: 대폭 증가
      min-spare: 200              # 🚨 최소 스레드 대폭 증가
    connection-timeout: 60000      # 🚨 60초 타임아웃
    keep-alive-timeout: 60000      # 🚨 Keep-Alive 연장
    max-connections: 50000         # 🚨 최대 연결 수 대폭 증가
    accept-count: 2000            # 🚨 대기 연결 수 대폭 증가


spring:
  kafka:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    consumer:
      group-id: order-service-group
  config:
    activate:
      on-profile: local

  # 데이터베이스 설정 (로컬 환경용, 성능 최적화)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${ORDER_USERNAME:order_app}
    password: ${ORDER_PASSWORD:order123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 500         # 🚨 Emergency: 10 → 500 (5xx 에러 해결)
      minimum-idle: 200              # 🚨 Emergency: 3 → 200
      connection-timeout: 10000      # 🚨 Emergency: 5초 → 10초
      idle-timeout: 300000           # 5분 유휴 타임아웃
      max-lifetime: 900000           # 🚨 Emergency: 30분 → 15분
      leak-detection-threshold: 30000 # 🚨 Emergency: 누수 감지 30초
      connection-test-query: SELECT 1 # 연결 테스트 쿼리
      keepalive-time: 30000          # 🚨 Emergency: Keep alive 30초
      validation-timeout: 5000       # 🚨 Emergency: 검증 타임아웃 5초

  # JPA 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # 로컬에서는 update 사용
    show-sql: false  # 성능을 위해 SQL 출력 비활성화
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false             # SQL 포맷팅 비활성화 (성능)
        default_schema: orders        # Order 서비스 전용 스키마
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        # 🚀 JPA 배치 및 성능 최적화 - 5xx 에러 해결
        jdbc:
          batch_size: 50              # 배치 처리 크기
          batch_versioned_data: true  # 버전 데이터 배치 처리
          fetch_size: 50              # 페치 크기
        order_inserts: true           # INSERT 순서 최적화
        order_updates: true           # UPDATE 순서 최적화
        use_sql_comments: false       # SQL 주석 비활성화 (성능)
        show_sql: false              # SQL 로깅 비활성화 (성능)
        # JCache 의존성 미탑재 환경에서도 안정 기동되도록 L2/Query 캐시 비활성화
        cache:
          use_second_level_cache: false
          use_query_cache: false

  # Flyway 설정
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    user: ${ORDER_FLYWAY_USERNAME:order_migrator}
    password: ${ORDER_MIGRATOR_PASSWORD:order321}
    enabled: true
    locations: classpath:db/migration
    schemas: orders  # Order 서비스 전용 스키마 사용
    default-schema: orders
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    placeholders:
      ORDER_MIGRATOR_PASSWORD: ${ORDER_MIGRATOR_PASSWORD:order321}

  # Redis 설정 (stores 서비스와 동일한 극한 성능 최적화)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1000ms  # 최적화: 10초 → 1초 (타임아웃 감소)
      command-timeout: 1000ms  # 최적화: 명령 실행 타임아웃 감소
      database: 0  # Payment, Stores 서비스와 동일한 database 0 사용
      connection-timeout: 1000ms  # 최적화: 연결 타임아웃 감소
      lettuce:
        pool:
          max-active: 1000           # 🚨 Emergency: 30 → 1000 (5xx 에러 해결)
          max-idle: 500             # 🚨 Emergency: 10 → 500
          min-idle: 200             # 🚨 Emergency: 5 → 200
          max-wait: 30000ms         # 🚨 Emergency: 2초 → 30초
          time-between-eviction-runs: 60000ms # 유휴 연결 정리 주기
          min-evictable-idle-time: 300000ms # 최소 유휴 시간
        shutdown-timeout: 2000ms

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

# 비동기 주문 처리 비활성화 (Redis Stream 사용)
async:
  order:
    enabled: false      # 비동기 주문 처리 비활성화

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Resilience4j 설정 (Circuit Breaker, Retry, Rate Limiter)
resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        failure-rate-threshold: 60
        minimum-number-of-calls: 5
        sliding-window-size: 15
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      userService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
      orderquery-service:
        failure-rate-threshold: 60
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 8s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      default:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
  retry:
    instances:
      paymentService:
        max-attempts: 2  # 3 → 2 (빠른 실패)
        wait-duration: 200ms  # 2s → 200ms (90% 단축)
        exponential-backoff-multiplier: 1.5  # 2 → 1.5 (더 짧은 백오프)
      userService:
        max-attempts: 2  # 3 → 2 (빠른 실패)
        wait-duration: 100ms  # 1s → 100ms (90% 단축)
      orderquery-service:
        max-attempts: 2  # OrderQuery 서비스 재시도 횟수
        wait-duration: 150ms  # OrderQuery 서비스 재시도 대기 시간
        exponential-backoff-multiplier: 1.5
      default:
        max-attempts: 2  # 3 → 2 (빠른 실패)
        wait-duration: 100ms  # 1s → 100ms (90% 단축)
  ratelimiter:
    instances:
      paymentService:
        limit-for-period: 150  # 100 → 150 (더 높은 처리량)
        limit-refresh-period: 1s
        timeout-duration: 200ms  # 1s → 200ms (80% 단축)
      userService:
        limit-for-period: 300  # 200 → 300 (더 높은 처리량)
        limit-refresh-period: 1s
        timeout-duration: 200ms  # 1s → 200ms (80% 단축)
      orderquery-service:
        limit-for-period: 200  # OrderQuery 서비스 호출 제한 (초당 200회)
        limit-refresh-period: 1s
        timeout-duration: 250ms  # OrderQuery 서비스 호출 타임아웃



# 프론트엔드 주소 설정
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

# 커스텀 설정
order:
  # 주문 관련 비즈니스 설정
  payment:
    timeout: ${ORDER_PAYMENT_TIMEOUT:5000}  # ⚡ 결제 대기 시간: 30초 → 5초 (83% 단축) - 극한 성능 최적화
    token-cache-ttl: 1800  # 결제 토큰 캐시 TTL (30분)
    url-cache-ttl: 1800    # 결제 URL 캐시 TTL (30분)
    status-cache-ttl: 300  # 결제 상태 캐시 TTL (5분)
  cancel:
    timeout: ${ORDER_CANCEL_TIMEOUT:600}   # ⚡ 취소 가능 시간: 30분 → 10분 (67% 단축)
  reservation:
    wait-timeout-ms: ${ORDER_RESERVATION_WAIT_TIMEOUT_MS:0}  # 예약 응답 대기 시간 (즉시 응답)
  notification:
    enabled: ${ORDER_NOTIFICATION_ENABLED:true}  # 알림 활성화
    retry-count: ${ORDER_NOTIFICATION_RETRY:2}   # ⚡ 알림 재시도 횟수: 3 → 2 (빠른 실패)
    async: true  # 비동기 알림 처리 (성능 최적화)
  orderquery:
    timeout-ms: ${ORDER_ORDERQUERY_TIMEOUT:3000}  # OrderQuery 서비스 호출 타임아웃 (3초)

logging:
  level:
    root: WARN  # 기본 로그 레벨을 WARN으로 설정하여 성능 개선
    com.popcorn.order: INFO  # DEBUG → INFO (20-30% 성능 향상)
    org.springframework.web: WARN  # DEBUG → WARN (웹 요청 로그 최소화)
    org.springframework.boot.web: WARN
    org.hibernate.SQL: INFO  # DEBUG → INFO (SQL 로깅 최소화로 큰 성능 향상)
    org.springframework.security: WARN
    com.adjh.springbootkafka: DEBUG
    org:
      apache.kafka: INFO
      springframework.kafka: INFO

# 외부 서비스 설정
external:
  services:
    users:
      base-url: ${USERS_SERVICE_BASE_URL:http://popcorn-gateway:8080}
    store:
      base-url: ${STORE_SERVICE_BASE_URL:http://popcorn-gateway:8080}
    orderquery:
      base-url: ${ORDERQUERY_SERVICE_BASE_URL:http://popcorn-gateway:8080}
  http:
    enabled: true  # HTTP 기반 외부 서비스 호출 활성화 (개발환경)
