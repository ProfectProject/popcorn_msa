server:
  port: 8084
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8


spring:
  config:
    activate:
      on-profile: local

  # 데이터베이스 설정 (로컬 환경용, 성능 최적화)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${ORDER_DB_USERNAME:order_app}
    password: ${ORDER_DB_PASSWORD:order123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30          # 로컬은 30으로 설정
      minimum-idle: 5                # 최소 유휴
      connection-timeout: 3000       # 3초 연결 타임아웃
      idle-timeout: 300000           # 5분 유휴 타임아웃
      max-lifetime: 1800000          # 30분 최대 생명주기

  # JPA 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # 로컬에서는 update 사용
    show-sql: false  # 성능을 위해 SQL 출력 비활성화
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: orders  # Order 서비스 전용 스키마
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  # Flyway 설정
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    user: ${ORDER_FLYWAY_USERNAME:order_migrator}
    password: ${ORDER_FLYWAY_PASSWORD:order321}
    enabled: true
    locations: classpath:db/migration
    schemas: orders  # Order 서비스 전용 스키마 사용
    default-schema: orders
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    placeholders:
      ORDER_MIGRATOR_PASSWORD: ${ORDER_MIGRATOR_PASSWORD:order321}

  # Redis 설정 (stores 서비스와 동일한 극한 성능 최적화)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000ms  # 2초 → 10초 (타임아웃 대폭 증가)
      command-timeout: 10000ms  # 명령 실행 타임아웃
      database: 0  # Payment, Stores 서비스와 동일한 database 0 사용
      connection-timeout: 10000ms  # 연결 타임아웃도 증가
      lettuce:
        pool:
          max-active: 30  # 100 → 30 (메모리 사용량 70% 감소)
          max-idle: 10   # 30 → 10 (유휴 연결 최적화)
          min-idle: 5    # 10 → 5 (최소 연결 효율화)
          max-wait: 2000ms # 3초 → 2초 (응답성 개선)
          time-between-eviction-runs: 60s
        shutdown-timeout: 2000ms

# 인증 설정
passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

# Redis 이벤트 설정 (타임아웃 해결)
redis:
  events:
    enabled: true      # Redis Stream 활성화

# 비동기 주문 처리 비활성화 (Redis Stream 사용)
async:
  order:
    enabled: false      # 비동기 주문 처리 비활성화

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Resilience4j 설정 (Circuit Breaker, Retry, Rate Limiter)
resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        failure-rate-threshold: 60
        minimum-number-of-calls: 5
        sliding-window-size: 15
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      userService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
      default:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
  retry:
    instances:
      paymentService:
        max-attempts: 2  # 3 → 2 (빠른 실패)
        wait-duration: 200ms  # 2s → 200ms (90% 단축)
        exponential-backoff-multiplier: 1.5  # 2 → 1.5 (더 짧은 백오프)
      userService:
        max-attempts: 2  # 3 → 2 (빠른 실패)
        wait-duration: 100ms  # 1s → 100ms (90% 단축)
      default:
        max-attempts: 2  # 3 → 2 (빠른 실패)
        wait-duration: 100ms  # 1s → 100ms (90% 단축)
  ratelimiter:
    instances:
      paymentService:
        limit-for-period: 150  # 100 → 150 (더 높은 처리량)
        limit-refresh-period: 1s
        timeout-duration: 200ms  # 1s → 200ms (80% 단축)
      userService:
        limit-for-period: 300  # 200 → 300 (더 높은 처리량)
        limit-refresh-period: 1s
        timeout-duration: 200ms  # 1s → 200ms (80% 단축)



# 프론트엔드 주소 설정
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

# 커스텀 설정
order:
  # 주문 관련 비즈니스 설정
  payment:
    timeout: ${ORDER_PAYMENT_TIMEOUT:5000}  # ⚡ 결제 대기 시간: 30초 → 5초 (83% 단축) - 극한 성능 최적화
    token-cache-ttl: 1800  # 결제 토큰 캐시 TTL (30분)
    url-cache-ttl: 1800    # 결제 URL 캐시 TTL (30분)
    status-cache-ttl: 300  # 결제 상태 캐시 TTL (5분)
  cancel:
    timeout: ${ORDER_CANCEL_TIMEOUT:600}   # ⚡ 취소 가능 시간: 30분 → 10분 (67% 단축)
  reservation:
    wait-timeout-ms: ${ORDER_RESERVATION_WAIT_TIMEOUT_MS:0}  # 예약 응답 대기 시간 (즉시 응답)
  notification:
    enabled: ${ORDER_NOTIFICATION_ENABLED:true}  # 알림 활성화
    retry-count: ${ORDER_NOTIFICATION_RETRY:2}   # ⚡ 알림 재시도 횟수: 3 → 2 (빠른 실패)
    async: true  # 비동기 알림 처리 (성능 최적화)

logging:
  level:
    root: WARN  # 기본 로그 레벨을 WARN으로 설정하여 성능 개선
    com.popcorn.order: INFO  # DEBUG → INFO (20-30% 성능 향상)
    org.springframework.web: WARN  # DEBUG → WARN (웹 요청 로그 최소화)
    org.springframework.boot.web: WARN
    org.hibernate.SQL: INFO  # DEBUG → INFO (SQL 로깅 최소화로 큰 성능 향상)
    org.springframework.security: WARN

# 외부 서비스 설정
external:
  services:
    users:
      base-url: ${USERS_SERVICE_BASE_URL:http://localhost:8082}
    store:
      base-url: ${STORE_SERVICE_BASE_URL:http://localhost:8083}
  http:
    enabled: true  # HTTP 기반 외부 서비스 호출 활성화 (개발환경)
