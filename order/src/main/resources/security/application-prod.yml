server:
  port: 8084
  shutdown: immediate

spring:
  kafka:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: order-service-group
  config:
    activate:
      on-profile: prod

  # 데이터베이스 설정 (프로덕션 환경)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${ORDER_USERNAME}
    password: ${ORDER_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # 프로덕션 커넥션 풀 최적화
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  # JPA 설정 (프로덕션)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 반드시 validate
    show-sql: false       # 프로덕션에서는 SQL 로그 비활성화
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: orders
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

  # Flyway 설정 (프로덕션)
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${ORDER_FLYWAY_USERNAME}
    password: ${ORDER_FLYWAY_PASSWORD}
    enabled: true
    baseline-on-migrate: true  # 프로덕션에서는 baseline 비활성화
    validate-on-migrate: true
    out-of-order: false         # 프로덕션에서는 순서 엄격히 적용
    locations: classpath:db/migration
    default-schema: orders
    schemas: orders

  # Redis 설정 (프로덕션)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      database: 0
      connection-timeout: 3000ms
      # 프로덕션 레디스 풀 설정
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000ms
        shutdown-timeout: 100ms

# 로깅 설정 (프로덕션 - 최적화)
logging:
  level:
    root: WARN
    com.popcorn.order: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.adjh.springbootkafka: DEBUG
    org:
      apache.kafka: INFO
      springframework.kafka: INFO


# 프론트엔드 주소 설정
frontend:
  base-url: ${FRONTEND_BASE_URL}

# 프로덕션 Order 서비스 비즈니스 설정
order:
  payment:
    timeout: ${ORDER_PAYMENT_TIMEOUT:15000}  # 프로덕션에서는 15초
    token-cache-ttl: 1800  # 결제 토큰 캐시 TTL (30분)
    url-cache-ttl: 1800    # 결제 URL 캐시 TTL (30분)
    status-cache-ttl: 300  # 결제 상태 캐시 TTL (5분)
  cancel:
    timeout: ${ORDER_CANCEL_TIMEOUT:900}     # 프로덕션에서는 15분
  reservation:
    wait-timeout-ms: ${ORDER_RESERVATION_WAIT_TIMEOUT_MS:0}  # 예약 응답 대기 시간 (즉시 응답)
  validation:
    max-quantity: ${ORDER_MAX_QUANTITY:50}   # 프로덕션에서는 더 제한적
    min-quantity: ${ORDER_MIN_QUANTITY:1}
  notification:
    enabled: ${ORDER_NOTIFICATION_ENABLED:true}
    retry-count: ${ORDER_NOTIFICATION_RETRY:5}  # 프로덕션에서는 더 많은 재시도
    timeout: 5000  # 알림 타임아웃 5초
  orderquery:
    timeout-ms: ${ORDER_ORDERQUERY_TIMEOUT:3000}  # OrderQuery 서비스 호출 타임아웃 (3초)

# 프로덕션 보안 설정
security:
  require-ssl: true

# 프로덕션 액추에이터 설정 (보안 강화)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never  # 프로덕션에서는 상세 정보 숨김

passport:
  secret: ${PASSPORT_SECRET}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# Kafka 설정 (공통 KafkaConfig 사용)
kafka:
  enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  consumer:
    group-id: order-service-group
    concurrency: 3
    max-poll-records: 500
    session-timeout-ms: 30000
    heartbeat-interval-ms: 10000
    auto-offset-reset: earliest
    enable-auto-commit: false
    groups:
      store-reservation: order-reservation-cg
      payment: order-payment-cg
  producer:
    acks: all
    retries: 2147483647
    enable-idempotence: true
    max-in-flight-requests-per-connection: 5
    compression-type: snappy
    batch-size: 16384
    linger-ms: 5
    request-timeout-ms: 30000
    delivery-timeout-ms: 120000
  test-topic:
    enabled: false
    name: test-topic
    group-id: order-test-topic-cg

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 외부 서비스 설정
external:
  services:
    users:
      base-url: ${USER_SERVICE_BASE_URL}
    store:
      base-url: ${STORE_SERVICE_BASE_URL}
    orderquery:
      base-url: ${ORDERQUERY_SERVICE_BASE_URL}
