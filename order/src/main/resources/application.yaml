# Spring Boot 기본 설정
spring:
  application:
    name: order-service

  # 기본 프로필 설정
  profiles:
    default: local

passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

---
# Local 환경 설정
spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: local
  # PostgreSQL 테스트 데이터베이스 설정 (.env 파일에서 읽기)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${ORDER_DB_USERNAME:order_app}
    password: ${ORDER_DB_PASSWORD:order123}
    driver-class-name: org.postgresql.Driver

  # 기본 JPA 설정 (프로필별로 오버라이드 가능)
  jpa:
    hibernate:
      ddl-auto: none  # 다시 validate 사용
    show-sql: ${JPA_SHOW_SQL:true}        # 기본값은 true (개발용)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect  # PostgreSQL dialect 명시
        format_sql: ${JPA_FORMAT_SQL:true}  # 기본값은 true (개발용)
        default_schema: orders
        type:
          preferred_enum_jdbc_type: NAMED_ENUM  # PostgreSQL enum 네이티브 지원

  # 기본 Flyway 설정
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    user: ${ORDER_FLYWAY_USERNAME:order_migrator}
    password: ${ORDER_FLYWAY_PASSWORD:order321}
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE:false}
    locations: classpath:db/migration

  # Docker Compose 자동 실행 비활성화 (개발 편의성)
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_AUTO:false}  # Docker 자동 실행 끄기

  # Redis 설정 (캐싱용)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      database: 0  # 테스트용 별도 데이터베이스
      connection-timeout: 2000ms
      jedis:
        pool:
          max-active: 30
          max-idle: 10
          min-idle: 2
          max-wait: 500ms

redis:
  idempotency:
    clear-on-startup: true
  events:
    enabled: true

---
# Local 환경 설정 (.env 파일 직접 사용)
spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: local
  # PostgreSQL 로컬 데이터베이스 설정 (.env 파일에서 읽기)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10분 TTL
      cache-null-values: false

# 커스텀 설정 (Local 프로필)
order:
  payment:
    timeout: ${ORDER_PAYMENT_TIMEOUT}
    token-cache-ttl: 1800
    url-cache-ttl: 1800
    status-cache-ttl: 300
  cancel:
    timeout: ${ORDER_CANCEL_TIMEOUT}
  validation:
    max-quantity: ${ORDER_MAX_QUANTITY}
    min-quantity: ${ORDER_MIN_QUANTITY}
  reservation:
    wait-timeout-ms: ${ORDER_RESERVATION_WAIT_TIMEOUT_MS:0}
  notification:
    enabled: ${ORDER_NOTIFICATION_ENABLED}
    retry-count: ${ORDER_NOTIFICATION_RETRY}
    async: true

# 프론트엔드 주소 설정 (Local 프로필)
frontend:
  base-url: ${FRONTEND_BASE_URL}

---
# 기본 로깅 설정 (프로필별로 오버라이드 가능)
logging:
  level:
    com.popcorn.order: ${LOG_LEVEL_ORDER:DEBUG}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_BINDER:TRACE}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# 관리용 엔드포인트 (모니터링)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI 문서 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 애플리케이션 정보
info:
  app:
    name: Order Service
    description: 주문 관리 마이크로서비스
    version: 1.0.0

# Resilience4j 설정 (Circuit Breaker, Retry, Rate Limiter)
resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        failure-rate-threshold: 60
        minimum-number-of-calls: 5
        sliding-window-size: 15
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      userService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
      default:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
  retry:
    instances:
      paymentService:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
      userService:
        max-attempts: 3
        wait-duration: 1s
      default:
        max-attempts: 3
        wait-duration: 1s
  ratelimiter:
    instances:
      paymentService:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 1s
      userService:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 1s

# HTTP 기반 동기 통신 설정
external:
  http:
    enabled: true  # HTTP 기반 외부 서비스 호출 활성화
  services:
    users:
      base-url: ${USERS_SERVICE_URL:http://localhost:8082}
      timeout: 5000ms
    store:
      base-url: ${STORE_SERVICE_URL:http://localhost:8083}
      timeout: 5000ms

# 프론트엔드 주소 설정
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

# 커스텀 설정
order:
  # 주문 관련 비즈니스 설정
  payment:
    timeout: ${ORDER_PAYMENT_TIMEOUT:30000}  # 결제 대기 시간 (30초)
  cancel:
    timeout: ${ORDER_CANCEL_TIMEOUT:1800}   # 취소 가능 시간 (30분)
  validation:
    max-quantity: ${ORDER_MAX_QUANTITY:100}  # 최대 주문 수량
    min-quantity: ${ORDER_MIN_QUANTITY:1}    # 최소 주문 수량
  reservation:
    wait-timeout-ms: ${ORDER_RESERVATION_WAIT_TIMEOUT_MS:0}   # 예약 응답 대기 시간 (즉시 응답)
  price-lookup:
    timeout-ms: ${ORDER_PRICE_LOOKUP_TIMEOUT_MS:3000}   # 가격 조회 타임아웃 (3초로 증가)
  user-lookup:
    timeout-ms: ${ORDER_USER_LOOKUP_TIMEOUT_MS:3000}    # 사용자 조회 타임아웃 (3초로 증가)
  notification:
    enabled: ${ORDER_NOTIFICATION_ENABLED:true}  # 알림 활성화
    retry-count: ${ORDER_NOTIFICATION_RETRY:3}   # 알림 재시도 횟수
